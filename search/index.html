ue=""/><p class="search-hint">输入关键词开始搜索：行业名、子领域、公司名均可。</p></div></div><!--$--><!--/$--></main><footer class="site-footer"><div class="container">行业认知科普 · 面向求职者的行业全景速览 · 内容仅供参考，不构成任何建议</div></footer><script src="/industry-insight/_next/static/chunks/webpack-cb5acdd383f3a7d5.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[1213,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"213\",\"static/chunks/213-dd590aceb622ac8c.js\",\"177\",\"static/chunks/app/layout-ed0a1284ddf7724e.js\"],\"TermProvider\"]\n3:I[2619,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"974\",\"static/chunks/app/page-e2367dc788e3212b.js\"],\"\"]\n4:I[9766,[],\"\"]\n5:I[8924,[],\"\"]\n6:I[8891,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"959\",\"static/chunks/app/search/page-d69a3748363b1532.js\"],\"default\"]\n1a:I[7150,[],\"\"]\n:HL[\"/industry-insight/_next/static/css/6c313e96cbcf89bb.css\",\"style\"]\n7:T2688,"])</script><script>self.__next_f.push([1,"新能源 New Energy 光伏、风电、储能、动力电池：把阳光与风变成能用的电 新能源 光伏 风电 储能 动力电池 碳中和 宁德时代 隆基绿能 金风科技 宁德时代 比亚迪 隆基绿能 通威股份 阳光电源 金风科技 三峡能源 远景能源 \n   1. 行业一句话定义\n\n新能源行业是  把自然界不稳定、但取之不尽的能量（太阳光、风、水流）转化为稳定、可控、可交易的电力，并把电力存进电池里随时取用的行业  。通俗说：光伏把阳光变成电，风电把风变成电，储能把\"多出来的电\"存起来，动力电池把电装进车里。它和传统能源（煤、油、气）最大的区别是：发的是  零碳  的电，但发多少由天气说了算，这让\"卖电\"和\"存电\"成了一门新生意。\n\n  📎 参考出处：\n    国家能源局 2025 年全国电力统计数据（2026 01 28 发布）：风光累计并网装机 18.4 亿千瓦、历史性超过火电\n    《中华人民共和国能源法》（2025 年 1 月 1 日施行）：确立可再生能源优先开发利用制度\n\n   2. 钱从哪来\n\n新能源的\"钱\"分三层，看清层次就能理解这门生意的本质：\n\n    发电侧：卖电给电网。   电站把发出来的电卖给电网公司／用电企业，收入 = 发电量 × 价格。过去是\"固定上网电价 + 财政补贴\"（看天吃饭、旱涝保收）；136号文（发改价格〔2025〕136 号）之后，  上网电量原则上全部进入电力市场，价格由现货+中长期市场竞价形成  ，另设\"机制电价\"做保底结算。钱流变为：谁的电便宜、谁发的时段对路，谁赚钱——收益从\"政策确定\"变成\"市场波动\"。\n    制造侧：卖给电站和车企。   组件、电池、风机是卖给下游的\"产品\"，靠毛利率生存。这是中国新能源竞争最惨烈的环节——硅料、组件、电池都经历过\"涨价暴利→产能过剩→价格战→全行业亏损\"的周期。\n    储能与服务的增值钱：   储能电站赚的是\"买低价电、高价/高峰时卖电\"的价差（峰谷套利）、给电网提供调频调峰等辅助服务的补偿，以及向用户收取的容量电价（国家 2026 年首次明确电网侧独立新型储能容量电价机制）。此外还有绿证和碳交易带来的绿色溢价。\n\n一句话总结：  上游制造赚\"薄利\"靠规模，下游运营赚\"现金流\"靠电价，储能赚\"时间差\"。   谁在买单？最终是工商业用户和居民的电费，以及通过绿证/碳市场付出绿色溢价的出口企业与高耗能企业。\n\n  📎 参考出处：\n    国家发展改革委、国家能源局《关于深化新能源上网电价市场化改革促进新能源高质量发展的通知》（发改价格〔2025〕136 号）\n    国家发展改革委《关于完善发电侧容量电价机制的通知》（发改价格〔2026〕114 号）\n    北京等省市 2027 年新能源增量项目机制电价竞价公告（北京市发改委 2026 09 24）\n\n   3. 产业链上下游\n\n以\"发 输 储 用\"为主线，新能源不是一个行业，而是一条互相咬合的链：\n\n  ① 光伏链（阳光→电）：  \n  上游：多晶硅（通威、协鑫）→ 硅片（TCL中环、隆基）→ 电池片（通威、爱旭）→ 组件（隆基、天合、晶科、晶澳）\n  中游：逆变器（阳光电源、华为数字能源）\n  下游：电站 EPC 建设 → 电站运营（三峡能源、龙源电力、中广核新能源）\n\n  ② 风电链（风→电）：  \n  上游：叶片、齿轮箱、轴承、塔筒（关键零部件，国产化已基本完成）\n  中游：整机制造（金风科技、远景能源、明阳智能、运达股份）\n  下游：陆上/海上风电场开发运营（央国企为主力）\n\n  ③ 储能链（电→存→放）：  \n  上游：正负极材料、电解液、隔膜、电芯（宁德时代、亿纬锂能、海辰储能）\n  中游：电池 PACK、BMS（电池管理系统）、EMS（能量管理系统）、系统集成（阳光电源、比亚迪储能）\n  下游：电源侧配储、工商业储能、户用储能、电网侧独立储能\n\n  ④ 动力电池链（电→车）：  \n  上游：锂、钴、镍等矿产资源 → 四大主材 → 电芯 → PACK → 整车厂\n  核心环节：  电芯  （占成本约 40%，掌握材料配方=掌握定价权）与  系统集成  （决定度电成本与安全性）\n\n   mermaid\nflowchart LR\n  A[上游：材料/矿/零部件]     B[中游：电芯·组件·整机]\n  B     C[下游：电站/整车/电网]\n  C     D[用户/消纳]\n  B     E[储能系统]\n  E     C\n   \n\n  📎 参考出处：\n    各环节代表企业取自上市公司公开年报/招股书（宁德时代 2025 年报、隆基绿能年报等）\n    产业链结构参考中国光伏行业协会（CPIA）年度报告、中国储能产业白皮书\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  宁德时代   动力电池全球市占率 39.2%（连续 9 年第一）、储能电池出货市占率 30.4%（连续 5 年第一）   2025 年报：动力电池全球累计装车超 2400 万辆，海外市占率升至 30%  \n  比亚迪   动力电池全球第二（约 16.4%）+ 新能源车销量全球第一   垂直整合样本：电池自产自用 + 外供  \n  隆基绿能   光伏组件龙头，坚定押注 BC 技术路线   2025 行业低谷逆势扩产 BC，代表\"技术路线之争\"的典型  \n  通威股份   \"硅料+电池片\"双龙头   硅料环节成本控制能力的标杆  \n  阳光电源   逆变器 + 储能系统全球第一梯队   \"光伏+储能+氢能\"多线布局  \n  金风科技   风电整机龙头（国内市占率领先）   海上风电 + 风机制造服务化转型  \n  三峡能源   新能源发电运营代表（央国企）   大型风光基地运营商，现金流型生意  \n  远景能源   风电 + 智能物联 + 储能新兴巨头   风机智慧化（EnOS 物联平台），民营龙头  \n\n  📎 参考出处：\n    宁德时代 2025 年年度报告（catl.com 官方发布）\n    SNE Research《2025 年全球动力电池装车量统计报告》、CNESA 储能数据\n    各公司年报/官网公开资料\n\n   5. 当前行业格局\n\n  规模（2025 年底，国家能源局口径）：  \n  风光累计并网装机   18.4 亿千瓦  ，历史性超过火电，占全国总装机 47.3%；其中太阳能 12.0 亿千瓦（+35.4%）、风电 6.4 亿千瓦（+22.9%）\n  2025 年新增风光装机超   4.3 亿千瓦  ，再创历史新高\n  新型储能装机突破 1 亿千瓦，占全球比重超 40%（全球最大）\n  关联侧：2025 年新能源汽车产销 1662.6 / 1649 万辆（+29% / +28.2%），新车渗透率 47.9%，10 月单月曾首破 50%\n\n  集中度与竞争态势：  \n    动力电池：双寡头。   宁德时代全球 39.2%、比亚迪 16.4%，两家合计超 55%；竞争在向储能和第二梯队（亿纬锂能、国轩高科、中创新航）扩散\n    光伏：从\"规模竞速\"转向\"效率竞争\"。   2024 2025 连续两年产业链整体亏损（行业测算亏损超千亿），2026 年进入\"反内卷\"攻坚期：产能管控、强制国标、成本核算通则落地，落后产能出清，头部企业加速并购整合\n    风电：整机集中度高，金风、远景、明阳、运达四家占大头，海上风电、深远海是增量主战场  \n    运营侧：央国企主导  （五大发电集团+三峡+中广核等），民营以分布式光伏、工商业储能切入\n\n一句话格局：  \"上游制造卷价格，下游运营卷电价，储能和海外是新增长点。\"  \n\n  📎 参考出处：\n    国家能源局 2025 年全国电力统计数据 / 全国可再生能源电力开发建设调度视频会（2026 02 12）\n    中国汽车工业协会 2025 年汽车工业数据（2026 01 16 发布）\n    证券日报《光伏行业仍承压 差异化技术等成扭转变量》（2026 04 30）\n\n   6. 行业壁垒\n\n新进入者想分一杯羹，至少要在四道关上掉层皮：\n\n    资金壁垒（最硬）：   硅料、电池产线是典型重资产，一条万吨级硅料线/百亿级电池基地动辄数十亿投入；电站开发更是资金密集型，回收期 7 10 年。没有钱，连入场券都摸不到。\n    技术壁垒（最活）：   电池的\"材料配方+工艺\"，光伏的\"效率路线\"（PERC→TOPCon→BC→钙钛矿叠层），风机的\"大型化+可靠性\"。技术路线押错=资产归零（例：押注 PERC 的产线在 TOPCon 时代加速贬值）。\n    资质与牌照壁垒（最严）：   电站要并网指标（备案/核准）、电力业务许可证；储能、电池要过安全认证；出口要欧美认证 + 应对反倾销/贸易壁垒。\n    渠道与客户壁垒（最隐性）：   车企对电池供应商认证周期以年计；电站投资方对组件品牌的\"可融资性\"有严格白名单；海外客户要长期可靠性验证。新品牌很难挤进头部客户名单。\n\n  📎 参考出处：\n    工信部等三部门发布的三项光伏能耗能效强制性国家标准（2026 07 02 批准，2027 01 01 实施）\n    行业研报对产能投资强度、认证周期的相关分析（中金/中信等行业策略报告；引用时建议补充具体报告名）\n\n   7. 核心监管机制\n\n  归口部门（多头监管）：  \n    国家发展改革委  ：电价政策、能源规划、项目核准/备案管理\n    国家能源局  ：电力市场建设、并网管理、可再生能源消纳责任权重\n    工业和信息化部  ：光伏、锂电等制造行业规范条件（产能、能耗、能效门槛）\n    市场监管总局  ：价格合规（反内卷价格执法）、产品质量监督\n    生态环境部  ：环境影响评价、碳市场（CCER）\n\n  关键政策法规（近两年主线"])</script><script>self.__next_f.push([1,"8:T24fd,"])</script><script>self.__next_f.push([1,"互联网与AI Internet \u0026 AI 连接、计算与智能：从流量生意到模型生意 互联网 AI 大模型 SaaS 电商 字节跳动 腾讯 百度 OpenAI 腾讯 阿里巴巴 字节跳动 百度 美团 拼多多 快手 DeepSeek \n   1. 行业一句话定义\n\n互联网与AI行业是  围绕\"连接、数据、算法\"做生意的技术服务业  。互联网解决\"人和信息/服务怎么连\"（搜索、社交、电商、内容、本地生活），AI 解决\"机器怎么理解世界并替人干活\"（大模型、智能推荐、AI 助手）。过去十年行业赚的是\"流量\"的钱——注意力在哪里、交易就在哪里；2025 年以来的新主线是赚\"智能\"的钱——大模型把复杂脑力劳动变成可规模化的服务，AI 从\"概念\"进入\"财报\"。\n\n通俗理解：互联网是\"把生意搬到线上\"，AI 是\"把人的智力/经验搬到线上\"。两者正在合流：所有互联网业务（广告、电商、游戏、云）都在被 AI 重构。\n\n  📎 参考出处：\n    腾讯、阿里巴巴、百度、快手 2025 年财报及业绩说明会\n    QuestMobile 2025 年中国互联网广告市场报告\n\n   2. 钱从哪来\n\n互联网与AI的\"钱\"分四层：\n\n    广告（最成熟的现金牛）：   流量平台把用户注意力和行为数据卖给广告主。这是中国互联网利润的基石。2025 年 Q2 中国互联网广告大盘同比仅增约 6.8%，但头部平台靠 AI 精准投放跑赢大盘：腾讯当季营销服务收入 358 亿元、同比 +19.73%，快手广告收入 197.65 亿元、+12.81%。视频号广告加载率仅 3 6%（抖音约 13 16%），说明腾讯广告还有\"加载率提升\"的存量空间。\n    电商与服务佣金：   平台撮合交易赚佣金、广告位、技术服务费。淘宝天猫、拼多多、京东、抖音电商、美团（本地生活/外卖）是主力。2025 年行业进入\"低价+即时零售\"双主线：消费者要更便宜，也要更快——半小时达成为新战场。快手电商 2025 年 GMV 同比增长约 15%，泛货架场景占比已超三成。\n    游戏与数字内容：   游戏是腾讯（长青游戏）、网易的核心利润来源；短剧、直播打赏、内容付费构成第二曲线。数字内容的钱本质是\"为情绪和时间付费\"。\n    云与 AI（增速最快的新引擎）：   大模型需要算力，AI 应用需要平台。阿里云 2025 财年收入 1180 亿元、增速回暖至 18%，AI 相关产品收入连续七个季度三位数增长；百度 AI 新业务收入 2025Q2 首破 100 亿元；腾讯、阿里资本开支同比分别 +91%、+168%，全部砸向 AI 基础设施。  这一层正在从\"成本中心\"变成\"第二增长曲线\"。  \n\n一句话总结：  广告赚\"注意力\"，电商赚\"交易\"，内容赚\"时间\"，云与AI赚\"生产力\"。   2025 年以来最大的变化是：AI 从\"讲故事的估值\"变成\"写进财报的收入\"——腾讯管理层明确表示 AI 已对广告和游戏营收产生实质贡献。\n\n  📎 参考出处：\n    腾讯 2025Q2/Q3 财报、阿里巴巴 2025 财年业绩\n    QuestMobile 互联网广告市场报告、快手 2025Q2 财报\n\n   3. 产业链上下游\n\n以\"流量—计算—交易\"为主线：\n\n  ① 上游（技术与基础设施）：  \n  算力：芯片（GPU/TPU）、数据中心、云计算（阿里云、腾讯云、火山引擎）→ 大模型（DeepSeek、通义千问、混元、豆包、文心）→ 开发工具（MaaS、API、开源框架）\n\n  ② 平台层（流量入口与生态）：  \n  社交（微信、QQ）→ 内容（抖音、快手、B站、小红书）→ 搜索（百度、微信搜一搜）→ 电商（淘宝天猫、拼多多、京东、抖音电商）→ 本地生活（美团、饿了么）→ 出行（滴滴、高德）\n\n  ③ 应用层（商家与用户服务）：  \n  广告主投放 → 商家开店/直播 → 创作者/开发者 → 企业客户（SaaS、数字化、AI Agent 落地）\n\n  ④ 终端用户：  \n  C 端消费者（免费产品+广告/付费增值）与 B 端企业（云、AI、数字化采购）共同构成了收入来源\n\n   mermaid\nflowchart LR\n  A[上游：算力·云·大模型]     B[平台层：社交/内容/搜索/电商]\n  B     C[应用层：广告主/商家/创作者/企业]\n  C     D[终端用户：C端+ B端]\n  D     B\n  A     C\n   \n\n  📎 参考出处：\n    各公司财报业务分部披露\n    IDC、QuestMobile 等第三方行业数据\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  腾讯   社交+内容+广告生态龙头，用户量约 12.66 亿居第一   2025Q3 营收 1928.69 亿元（+15%）；AI 拉动广告与游戏，视频号商业化空间大  \n  阿里巴巴   电商+云双主业，用户量约 12.55 亿   三年 3800 亿元 AI 基建；AI 相关产品收入连续七季度三位数增长  \n  字节跳动   抖音集团短视频/直播电商霸主，用户量第一梯队   火山引擎 AI 云高增长；TikTok 全球化商业变现加速  \n  百度   搜索基本盘+AI 转型   2025Q2 AI 新业务收入首破 100 亿（+34%），萝卜快跑 Robotaxi 规模化运营  \n  美团   本地生活与即时零售龙头   \"万物到家\"重塑消费习惯，外卖/闪购双增长  \n  拼多多   性价比电商代表   Temu 跨境电商高增长，重塑海外电商格局  \n  快手   短视频第二极   2025Q2 广告 197.65 亿元（+12.81%），短剧/本地生活驱动  \n  DeepSeek   开源大模型\"鲶鱼\"   以极低推理成本震动全球，推动大模型\"智能平权\"与国产生态繁荣  \n\n  📎 参考出处：\n    各公司 2025 年财报/季度业绩\n    QuestMobile 2025 年 8 月企业去重总用户量 TOP15 榜单\n\n   5. 当前行业格局\n\n  规模与流量（2025 年）：  \n  腾讯（12.66 亿）、阿里巴巴（12.55 亿）、抖音集团、百度四家用户量超 10 亿，构成第一梯队\n  中国互联网广告大盘增速放缓至个位数（2025Q2 约 +6.8%），行业进入\"存量竞争+结构分化\"阶段\n  AI 产业进入\"营收兑现期\"：BAT 资本开支大幅加码（阿里 +168%、腾讯 +91%），AI 相关收入从\"三位数增长的披露项\"变成\"对整体营收有实质贡献\"\n\n  竞争态势（三条主线）：  \n    广告：AI 化与生态化。   腾讯靠\"AI 广告系统+微信交易生态\"连续 11 个季度双位数增长，与大盘 6.8% 形成鲜明反差；抖音、快手继续吃短视频/直播广告红利。\n    电商：低价+泛货架+即时零售。   拼多多式性价比逻辑蔓延全行业；快手泛货架电商占比超 30%；美团闪购把\"即时零售\"做成新增长极。\n    AI：开源平权+应用爆发。   DeepSeek 开源把推理成本打到极低，引发\"AI 应用层\"创业潮；Agent（自主执行任务的 AI）被视为下一个平台级机会；BAT 从\"卷模型参数\"转向\"卷应用落地与商业化\"。\n\n一句话格局：  \"流量红利见顶，AI 红利刚开局；广告拼效率，电商拼履约，AI 拼能不能挣到钱。\"  \n\n  📎 参考出处：\n    QuestMobile 2025 年 8 月用户规模榜单\n    腾讯/阿里/百度 2025 年财报；多家媒体 2025 年互联网行业复盘\n\n   6. 行业壁垒\n\n    网络效应（最硬）：   社交、电商、内容平台的用户越多越有价值，强者通吃。微信 14 亿级月活、淘宝天猫的商家生态，是后来者几乎无法复制的护城河。\n    数据飞轮（AI 时代的核心）：   用户行为数据→训练模型→推荐更准→用户时长更长→数据更多。谁有高频场景谁就有数据优势。\n    规模与资本壁垒：   云计算数据中心是百亿级重资产；大模型训练一次投入数亿到数十亿元。阿里三年 3800 亿元 AI 基建、腾讯年资本开支逼近千亿，是一般公司无法跟进的门槛。\n    生态锁定：   小程序、支付、账号体系把用户和商家绑定在平台内；开发者依赖平台 API 与流量分发，形成正反馈。\n    组织与人才壁垒：   AI 大厂的核心竞争是顶级算法人才密度；模型能力、工程化交付能力决定商业落地的速度。\n\n  📎 参考出处：\n    各公司资本开支披露（2025 年财报）\n    行业研报对互联网平台护城河的分析\n\n   7. 核心监管机制\n\n  归口部门（多头监管）：  \n    网信办  ：算法推荐、深度合成、生成式 AI 内容标识，内容安全审核\n    市场监管总局  ：反垄断、平台经济合规、不正当竞争（\"二选一\"、价格行为）\n    数据局  ：数据要素市场化、数据跨境流动、公共数据开放\n    工信部  ：APP 备案、信息服务许可、生成式 AI 备案\n    证监会/金融监管部门  ：互联网金融、支付、消费贷的金融属性业务\n\n  关键政策法规（近两年主线）：  \n  《生成式人工智能服务管理暂行办法》：生成式 AI 上线需备案、内容需标识\n  平台经济\"常态化监管\"：从专项整改转向支持规范发展，强调\"互联互通\"（如微信开放外链）\n  《数据二十条》与数据要素市场化：数据确权、定价、入表（数据资产计入财务报表）\n  反垄断与\"二选一\"治理：大型平台限制竞争的强监管仍在延续\n  未成年人保护与算法治理：青少年模式、防沉迷、算法推荐规范持续加码\n\n  准入条件提示：   提供生成式 AI 服务需完成算法备案；经营支付、金融、医疗等强监管业务需持牌"])</script><script>self.__next_f.push([1,"9:T2577,"])</script><script>self.__next_f.push([1,"半导体 Semiconductor 芯片：所有智能设备的心脏 半导体 芯片 晶圆 光刻 EDA 中芯国际 台积电 设计 制造 中芯国际 台积电 北方华创 长电科技 华为海思 寒武纪 韦尔股份 华虹半导体 \n   1. 行业一句话定义\n\n半导体行业是  造\"芯片\"的行业——把电路设计浓缩到指甲盖大小的硅片上，让电子设备拥有计算、存储和连接能力  。芯片分为三大环节：  设计  （画电路图）、  制造  （在晶圆上把电路做出来）、  封测  （切割、封装、测试后变成可用的芯片）。它是所有电子工业的\"心脏\"：手机、电脑、汽车、家电、服务器，没有芯片几乎寸步难行；AI 时代的算力竞争，本质也是芯片竞争。\n\n通俗理解：设计是\"写剧本\"，制造是\"拍电影\"（最烧钱、最难），封测是\"剪辑上映\"。中国目前的强项在设计数量与成熟制程制造，卡脖子主要在先进制程设备、EDA 软件与高端材料。\n\n  📎 参考出处：\n    中国半导体行业协会、SIA 等 2025 年行业数据\n    中芯国际 2025 年度业绩公告\n\n   2. 钱从哪来\n\n半导体的\"钱\"分五层：\n\n    设计公司卖芯片（Fabless 模式）：   高通、联发科、海思、韦尔、寒武纪等只做设计，把制造外包。收入 = 芯片单价 × 出货量，毛利率高（消费级 40 60%）。\n    晶圆代工赚加工费（Foundry 模式）：   台积电、中芯国际、华虹代客户制造芯片，按晶圆片数与制程节点收费。重资产、折旧高，但产能利用率决定盈利。中芯国际 2025 年营收 673.23 亿元、毛利率维持在较高水平，产能利用率 93.5%。\n    IDM 全链条模式：   英特尔、三星、德州仪器自己设计+制造+封测一体，吃全环节利润。\n    设备与材料（卖铲子的人）：   光刻机（ASML）、刻蚀/薄膜设备（应用材料、北方华创）、光刻胶、硅片、电子特气。全球设备市场年规模千亿美元级，是国产化最受关注、弹性最大的环节。\n    封测（劳动+技术密集）：   长电科技、通富微电等提供封装与测试服务，先进封装（Chiplet、2.5D/3D）附加值持续提升。\n\n一句话总结：  设计赚\"技术溢价\"，制造赚\"规模与工艺\"，设备材料赚\"卡位\"，封测赚\"工艺与量\"。\"卖铲子\"的设备材料环节，在国产替代逻辑下弹性最大。  \n\n  📎 参考出处：\n    中芯国际 2025 年全年业绩公告\n    SEMI、SIA 全球半导体设备与市场规模数据\n\n   3. 产业链上下游\n\n以\"设计—制造—封测—应用\"为主线：\n\n  ① 上游（材料与设备）：  \n  半导体设备：光刻机（ASML）、刻蚀（北方华创、中微）、薄膜沉积、清洗、离子注入\n  半导体材料：硅片、光刻胶、电子特气、CMP 抛光液、湿电子化学品（与化工与新材料 化工行业交叉）\n  EDA/IP：芯片设计的\"工业软件\"（Synopsys、Cadence、华大九天），设计工具自主化是卡脖子点\n\n  ② 中游（芯片设计与制造）：  \n  IC 设计：（数字）CPU/GPU/AI 芯片/SoC；（模拟）电源管理、射频、功率；存储（DRAM/NAND）\n  晶圆制造：成熟制程（28nm 及以上）与先进制程（7nm/5nm/3nm 及以下）\n  封测：传统封装 + 先进封装（Chiplet、2.5D/3D）\n\n  ③ 下游（应用买单方）：  \n  消费电子（手机/PC/可穿戴）→ 智能汽车（车规芯片）→ 数据中心与 AI 服务器（GPU/HBM）→ 工业/通信/物联网\n\n   mermaid\nflowchart LR\n  A[上游：设备·材料·EDA]     B[中游：IC设计]\n  A     C[中游：晶圆制造]\n  B     C\n  C     D[中游：封测]\n  D     E[下游：消费电子/汽车/AI服务器]\n  B     E\n   \n\n  📎 参考出处：\n    SEMI 全球半导体产业数据\n    各环节代表公司年报与招股书\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  台积电   全球晶圆代工霸主（市占率约六成）   3nm/2nm 先进制程领先，AI 芯片（英伟达等）核心代工方  \n  中芯国际   国内晶圆代工龙头   2025 年营收 673.23 亿元（+16.5%）、产能利用率 93.5%，成熟制程为主+先进制程突围  \n  北方华创   国内半导体设备龙头   刻蚀、薄膜沉积等设备平台化布局，国产替代核心标的  \n  长电科技   全球前三封测企业   先进封装技术（Chiplet）承接 AI 芯片封装需求  \n  华为海思   高端芯片设计代表   麒麟（手机）、昇腾（AI）全栈自研，推动国产 EDA/工具链  \n  寒武纪   AI 芯片明星公司   受益国产算力需求，训练/推理芯片国产替代主力  \n  韦尔股份   全球 CIS 图像传感器龙头   手机、汽车摄像头芯片供应，模拟/传感品类延伸  \n  华虹半导体   特色工艺代工厂   功率半导体、嵌入式存储等差异化制造，产能利用率高  \n\n  📎 参考出处：\n    各公司 2025 年财报/官方公告\n    TrendForce 晶圆代工市占率数据\n\n   5. 当前行业格局\n\n  规模（2025 年）：  \n  中国半导体销售额首次突破 2000 亿美元关口（部分口径预估 2025 年集成电路产业销售收入约 2450 亿美元、同比 +22%）\n  中国集成电路产量 2025 年达 4843 亿颗；芯片设计企业突破 3900 家；行业总销售额超 8300 亿元\n    成熟制程国产化率接近 45%  ，正稳步迈向 2026 年 55% 的目标；汽车芯片国产化率从数年前的不足 5% 显著提升\n  中芯国际 2025 年全年营收 673.23 亿元（同比 +16.5%），净利润 50.41 亿元（+36%），稳居 A 股半导体营收榜首\n\n  竞争态势（三条主线）：  \n    AI 芯片结构性牛市：   2025 年半导体行业复苏由 AI 驱动，存储（HBM、DDR5）涨价、AI 服务器 GPU 供不应求；寒武纪、海光等国产算力公司业绩爆发。\n    成熟制程国产替代：   28nm 及以上产能快速扩张，中国在成熟制程形成成本与规模优势；高端制程、关键设备、EDA 仍依赖进口，是\"卡脖子\"主战场。\n    周期波动中分化：   行业从 2023 年下行周期走出后，消费电子需求温和复苏，功率/模拟等环节仍在降价去库存，设计、制造、设备、封测各环节景气度不一。\n\n一句话格局：  \"AI 芯片是景气主线，成熟制程是国产替代的主战场，先进制程与设备 EDA 是长期突围的硬骨头。\"  \n\n  📎 参考出处：\n    中国半导体行业协会、工信部 2025 年数据\n    中芯国际 2025 年年报；券商 2025 2026 半导体行业策略报告\n\n   6. 行业壁垒\n\n    技术壁垒（极高）：   先进制程（3nm/2nm）涉及材料、光学、工艺、良率的极端工程学难题，全球只有台积电、三星、英特尔少数玩家。光刻机（EUV）全球只有 ASML 能造。\n    资本壁垒（极高）：   一座先进晶圆厂投资动辄百亿美元级，折旧期长、回报周期以十年计。中芯国际、华虹的扩产主要靠国家大基金等长期资本支持。\n    人才壁垒：   芯片人才（工艺、设计、设备、EDA）培养周期长、经验积累慢，全球人才紧缺，国内缺口数十万人量级。\n    生态与客户认证壁垒：   芯片流片验证周期长、导入成本高，客户一旦采用就高度粘性；车规、军工芯片认证周期更长。\n    专利与 IP 壁垒：   架构授权（ARM/x86）、EDA 工具生态、标准必要专利构成潜在进入障碍。\n\n  📎 参考出处：\n    SEMI 晶圆厂投资数据\n    半导体行业协会人才报告\n\n   7. 核心监管机制\n\n  归口部门与机制：  \n    工信部  ：产业政策、集成电路企业税收优惠、重大项目审批\n    国家发改委  ：电子信息产业投资引导与项目管理\n    国家大基金  （国家集成电路产业投资基金）：千亿级股权投资，扶持设计、制造、设备材料全链条\n    商务部/海关  ：进出口管制与反制措施（关键物项、两用物项出口管制）\n\n  关键政策（近两年主线）：  \n  出口管制与\"实体清单\"：美国对华先进制程设备、高端 GPU（如 H100/A100 等）实施出口限制，倒逼国产替代加速\n  2026 年政府工作报告将集成电路列为新兴支柱产业首位，提出\"发挥新型举国体制优势、全链条推进关键核心技术攻关\"\n  \"科创板八条\"等资本市场政策：支持半导体硬科技企业融资并购\n  税收优惠延续：集成电路企业\"十年免征所得税\"等优惠\n\n  准入条件提示：   芯片设计/制造企业需符合安全审查与环保要求；涉及军民两用技术需遵守出口管制法规；重大项目需产业政策符合性审查。\n\n  📎 参考出处：\n    2026 年政府工作报告\n    美国商务部 BIS 出口管制相关公告；国家集成电路产业投资基金公开信息\n\n   8. 行业风险\n\n    地缘政治风险（最大变量）：   出口管制升级、设备断供、技术封锁会直接打断先进制程与高端芯片供给；但也持续强化\"国产替代\"的确定性与政策支持力度。\n    技术路线风险：   先进制程推进放缓、Chiplet/先进封装路径分化、存储/HBM 技术迭代，押错方向损失巨大。\n    周期波动风险：   半导体是典型周期行业，需求（消费电子/PC/手机）波动导致产能过剩与价格战，设计公司库存减值。\n    产能过剩风险：   成熟制程大规模扩产后可能重复光伏式内卷，价格与毛利率承压"])</script><script>self.__next_f.push([1,"a:T277c,"])</script><script>self.__next_f.push([1,"智能汽车 Smart Vehicle 电动化、智能化、网联化：汽车变成移动终端 智能汽车 新能源车 自动驾驶 智能座舱 比亚迪 蔚来 特斯拉 比亚迪 吉利汽车 华为（鸿蒙智行/问界） 小米汽车 理想汽车 零跑汽车 特斯拉 宁德时代 \n   1. 行业一句话定义\n\n智能汽车是  在电动化基础上叠加智能化与网联化，让汽车从\"发动机+车壳\"变成\"电池+芯片+大模型\"的移动终端  。通俗说：电动化解决\"车怎么跑\"（电池、电机、电控），智能化解决\"车怎么开、车里怎么体验\"（智驾、座舱），网联化解决\"车怎么连\"（车联网、车路协同）。它仍是\"造车\"这门生意，但竞争的主战场已经从发动机和变速箱，转移到电池成本、高阶智驾体验和软件生态。\n\n  📎 参考出处：\n    中国汽车工业协会 2025 年汽车工业产销数据\n    多家券商 2025 2026 年智能汽车行业策略报告（格局与路线判断）\n\n   2. 钱从哪来\n\n智能汽车的\"钱\"分四层：\n\n    整车销售：卖车给消费者。   这是主业。收入 = 销量 × 单车价格。2025 年国内新能源乘用车销量约 1200 万辆量级、渗透率首破 50%（部分口径 60%+），比亚迪以约 27 30% 市占率稳居第一。整车盈利高度依赖规模：单车固定成本摊薄后，头部与尾部的利润差距是数量级差异。\n    智能化溢价：卖软件和体验。   高阶智驾包（一次性买断/订阅）、智能座舱配置、OTA 升级是新的利润来源。华为系把\"智驾=核心竞争力\"打成了行业共识：问界、智界合计销量数十万辆，ADS 高阶包成为溢价抓手。\n    供应链的钱：卖零件给车企。   电池（宁德时代）、芯片、传感器、线束、座舱域控等是万亿级零配件市场，车企自研（比亚迪垂直整合）与第三方供货并存。\n    后市场与服务：维修、保险、金融、充换电、出行。   卖车后的长尾收入，也被视为车企\"第二曲线\"（如蔚来换电、车企系保险）。\n\n一句话总结：  整车赚\"规模差\"，智能化赚\"溢价\"，供应链赚\"卡位\"，后市场赚\"长尾\"。   谁在买单？最终是消费者（购车+软件订阅）与为车队/出行付费的企业客户。\n\n  📎 参考出处：\n    中汽协 2025 年数据；比亚迪、小米、理想等公司官方销量公告/财报\n    各券商对智能驾驶软件付费模式的行业分析\n\n   3. 产业链上下游\n\n以\"设计→制造→智能化→使用\"为主线：\n\n  ① 上游（材料与零部件）：  \n  动力电池（宁德时代、比亚迪弗迪）→ 电驱电控（汇川、华为电驱）→ 车身材料/一体化压铸（文灿、拓普）→ 芯片与传感器（地平线、黑芝麻、禾赛、速腾聚创）→ 座舱域控与屏幕（德赛西威、京东方）\n\n  ② 中游（整车设计与制造）：  \n  整车厂分三类：传统巨头转型（吉利、长安、奇瑞、上汽）、新势力（理想、蔚来、小鹏、零跑、小米）、跨界赋能方（华为深度合作模式）\n  生产端进入\"平台化+一体化压铸+高度自动化\"阶段，制造效率决定成本下限\n\n  ③ 智能化（2025 年竞争焦点）：  \n  高阶智驾：城市 NOA 从\"高配\"走向\"平价普及\"，比亚迪\"天神之眼\"开启全民智驾\n  智能座舱：大模型上车、舱驾一体芯片，座舱成为\"第三生活空间\"\n  网联化：车路云一体化试点城市扩展，车联网前装渗透率提升\n\n  ④ 下游（使用与服务）：  \n  消费者（家庭/个人）→ 出行平台（Robotaxi 试点）→ 物流货运（新能源商用车）→ 二手车与报废回收\n\n   mermaid\nflowchart LR\n  A[上游：电池·芯片·材料·零部件]     B[中游：整车设计制造]\n  B     C[智能化：智驾·座舱·网联]\n  C     D[下游：消费者/出行/物流]\n  B     E[后市场：金融·保险·服务]\n  E     D\n   \n\n  📎 参考出处：\n    各环节代表公司公开年报与招股书\n    中国汽车工业协会、盖世汽车等产业数据\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  比亚迪   新能源车全球销冠，国内市占率约 27 30%   垂直整合+天神之眼全民智驾，2025 年发布兆瓦闪充战略  \n  吉利汽车   2025 年总销量超 300 万辆，国内\"双雄\"之一   银河系列上量，与极氪、领克多品牌协同  \n  华为（鸿蒙智行）   智驾/座舱技术赋能方，问界+智界合计数十万辆   ADS 3.0 高阶智驾成为核心竞争力，城市 NOA 领先  \n  小米汽车   2025 年新势力最大黑马   全年交付约 60 万辆级，小米生态互联+性价比  \n  理想汽车   增程路线代表   家庭市场定位清晰，组织效率与毛利率领先  \n  零跑汽车   2025 年新势力交付冠军   极致性价比，销量同比翻倍以上  \n  特斯拉   智能电动车开创者   2025 年中国零售销量同比下滑，FSD 入华进展受关注  \n  宁德时代   动力电池全球第一   神行/麒麟电池迭代，与多个车企深度绑定  \n\n  📎 参考出处：\n    各公司 2025 年官方销量公告/年报\n    SNE Research、中国汽车工业协会数据\n\n   5. 当前行业格局\n\n  规模（2025 年，中汽协口径）：  \n  新能源车产销约 1662.6 / 1649 万辆（不同口径有差异），同比 +29% / +28.2%\n  渗透率首次突破 50%，10 月单月曾首破 50%，标志\"油电倒挂\"时代到来\n  中国新能源乘用车出口、全球市占率继续提升，比亚迪全球销量登顶，中国成为全球新能源技术策源地\n\n  集中度与竞争态势：  \n    头部集中、两极分化：   比亚迪+吉利形成\"双雄\"，传统巨头（奇瑞、长安、上汽五菱）加速转型；新势力梯队洗牌，零跑、小米崛起，部分品牌掉队\n    智能化成胜负手：   华为系把\"高阶智驾\"做成大众心智；比亚迪\"天神之眼\"把智驾打到 10 万元级；车企竞相\"卷智驾、卷补能、卷价格\"\n    价格战与\"反内卷\"并存：   价格战频发、部分车企以价换量，行业层面出现\"反内卷\"共识，供应商账期、裁员等矛盾浮出水面\n    海外与出海：   中国车企加速进入东南亚、中东、拉美、欧洲市场；贸易壁垒（欧盟关税、美国关税）成为最大外部变量\n\n一句话格局：  \"电动化进入存量竞争，智能化决定下一轮座次；卷价格是生存战，卷智驾是排位战。\"  \n\n  📎 参考出处：\n    中国汽车工业协会 2025 年汽车工业数据\n    多家媒体对 2025 年中国车市格局的年度总结\n\n   6. 行业壁垒\n\n    资金壁垒（极高）：   整车平台/工厂是百亿级重资产，研发+产能+渠道投入巨大；新势力普遍经历了多年亏损换规模，资金链是淘汰赛的关键变量。\n    技术壁垒（最活）：   三电（电池、电机、电控）与智驾算法（感知 决策 执行）双线并进；800V平台超快充、一体化压铸、端到端智驾模型成为新技术卡位点，押错路线代价极高。\n    资质壁垒：   整车生产需工信部准入（资质），代工、并购壳资源在历史上成为稀缺资产；智能网联汽车需符合数据安全、OTA 备案等要求。\n    规模与成本壁垒：   单车固定成本摊薄依赖规模；比亚迪靠垂直整合（电池自产+自研芯片）构筑成本护城河，小厂难以复制。\n    生态壁垒（新）：   智驾数据飞轮（行驶里程→模型迭代）、车主生态（车手互联、全屋智能）构成新的网络效应。\n\n  📎 参考出处：\n    工信部《道路机动车辆生产企业及产品准入管理办法》等政策\n    行业研报对造车资金门槛、规模效应的分析\n\n   7. 核心监管机制\n\n  归口部门（多头监管）：  \n    工业和信息化部  ：整车准入、智能网联汽车产品管理、OTA 备案\n    交通运输部/公安部  ：道路测试与示范应用（自动驾驶牌照、Robotaxi 运营许可）\n    国家发展改革委  ：产业政策、投资项目管理\n    市场监管总局  ：价格行为（反内卷）、召回与质量监管\n    网信办/数据局  ：汽车数据安全、个人信息保护\n\n  关键政策法规（近两年主线）：  \n  《新能源汽车产业发展规划》及系列支持政策：补贴退坡后转向\"免购置税延续、充电基础设施建设、以旧换新\"等拉动手段\n  智能网联汽车准入与上路通行试点：L3 级有条件自动驾驶准入从\"测试\"走向\"运营\"试点\n  汽车数据安全与个人信息保护规范：车外数据、座舱数据采集边界明确\n  \"国补\"/以旧换新政策：2025 年购车补贴直接拉动销量，是行业最大短期变量之一\n\n  准入条件提示：   整车企业需具备生产资质；智驾功能上市需符合道路交通安全与数据合规要求；Robotaxi 需地方试点许可。\n\n  📎 参考出处：\n    工信部、公安部、交通运输部等官方政策文件（智能网联汽车准入试点通知等）\n    国家数据局/网信办汽车数据安全相关规范\n\n   8. 行业风险\n\n    价格战与盈利风险：   以价换量压缩毛利，部分车企卖一辆亏一辆；供应商被压账期，链条利润整体下行。\n    技术路线风险：   增程 vs 纯电、激光雷达 vs 纯视觉、端到端智驾路线之争，押错方向可能被快速淘汰。\n    地缘与贸易风险：   欧盟反补贴关税、美国关税与限制措施，直接影响出口与海外建厂节奏。\n    数据与安全风险：   智驾事故责任界定、数据跨境合规、OTA 召回，监管收紧会提高运营成本。\n    宏观经济风险：   汽车是大宗可选消费，消费信心与收入预期波动直接影响换购需求。\n    供应链风险：   芯片、电池材料价格波动；上游供应链（如电池降价周期）传导影响整车定价策略。\n\n  📎 参考出处：\n    2025 年中国车市价格战与车企盈利相关报道\n  "])</script><script>self.__next_f.push([1,"b:T24d0,"])</script><script>self.__next_f.push([1,"生物医药 Biopharma 研发周期长、监管严、天花板高的慢生意 生物医药 创新药 CXO 医疗器械 恒瑞医药 药明康德 恒瑞医药 百济神州 药明康德 信达生物 三生制药 科伦博泰 迈瑞医疗 石药集团 \n   1. 行业一句话定义\n\n生物医药行业是  研发、生产、销售\"治病救人的药和器械\"的行业  ，核心特征是  研发周期长（一个新药从立项到上市常需 10 年以上）、投入大（单药研发成本常以十亿美元计）、监管严（上市需层层审批）、但天花板极高（一款重磅药年销售可达数百亿元）  。\n\n它分为两条主干：  医药  （创新药、仿制药、疫苗、中药）+   医疗器械  （设备、耗材、体外诊断）。按商业模式又分\"卖药型\"（药企）与\"卖水型\"（CXO，为药企提供研发和生产外包服务）。2025 年最亮眼的主题是  创新药出海（License out）爆发  ——中国创新药从\"跟跑\"进入\"并跑、局部领跑\"的新阶段。\n\n  📎 参考出处：\n    国家药监局 2025 年药品审批统计\n    医药魔方 NextPharma 数据库 License out 统计\n\n   2. 钱从哪来\n\n生物医药的\"钱\"分五层：\n\n    药品销售（核心收入）：   医院处方+院外零售+线上药店。创新药靠专利期独家销售赚高毛利，仿制药靠走量赚薄利。恒瑞医药 2025 年前三季度营收约 232 亿元（+14.85%），创新药收入占比持续提升。\n    License out 出海（2025 年最大增量）：   把海外权益授权给跨国药企，收首付款+里程碑款+销售分成。2025 年全年中国创新药对外授权 157 起、潜在交易总额 1356.55 亿美元、首付款 70 亿美元，远超 2024 年（519 亿美元/94 起）。这意味着中国药企做大药的能力被全球认可，跨国药企愿意真金白银\"买中国的未来\"。\n    医保支付+自费+商业保险：   中国药企比全球同行更依赖医保谈判放量；自费与商保（惠民保、高端医疗险）是创新药补充支付来源。\n    CXO 服务费（卖水人模式）：   药明康德、药明生物、泰格医药等为全球药企提供研发（CRO）与生产（CDMO）外包，收入确定性高、不受单一药品成败影响。\n    医疗器械销售：   迈瑞、联影等靠设备与耗材全球化，壁垒在渠道、品牌与持续创新。\n\n一句话总结：  \"卖药赚'专利与规模'，出海赚'全球溢价'，CXO 赚'服务费'，器械赚'渠道与品牌'。\" 2025 年后，License out 成为衡量中国创新药价值的最核心指标。  \n\n  📎 参考出处：\n    恒瑞医药 2025 年三季报\n    《经济参考报》、医药魔方数据库 License out 数据\n\n   3. 产业链上下游\n\n以\"研发—生产—流通—支付\"为主线：\n\n  ① 上游（研发与生产的输入）：  \n  原料药/中间体、试剂耗材、生物反应器、制药设备\n  临床资源：医院、研究者、CRO（临床试验外包）、SMO（现场管理）\n\n  ② 中游（药企与 CXO）：  \n  创新药企：研发管线→临床（I/II/III 期）→报批（NDA）→上市放量→医保谈判/出海授权\n  仿制药企：仿制+一致性评价+集采\n  CXO：CRO（研发外包：临床前/临床）+ CDMO/CMO（生产外包）\n  医疗器械：IVD（体外诊断）、影像设备、高值耗材\n\n  ③ 下游（流通与支付）：  \n  医院（公立为主）、零售药店、电商平台\n  医保基金、商业保险、患者自费\n  海外市场（License out 授权方、海外销售网络）\n\n   mermaid\nflowchart LR\n  A[上游：原料·试剂·临床资源]     B[中游：创新药/仿制药研发]\n  A     C[CXO：CRO临床外包/CDMO生产外包]\n  B     C\n  B     D[审批上市]\n  D     E[下游：医院/药店/医保/患者]\n  D     F[出海：License out/海外销售]\n   \n\n  📎 参考出处：\n    药明康德等 CXO 公司年报\n    医药行业产业链研究公开资料\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  恒瑞医药   中国创新药\"一哥\"   2025 年前三季度营收约 232 亿（+14.85%）；5 笔 License out 首付合计约 8 亿美元  \n  百济神州   全球化标杆   泽布替尼全球放量，2025 年经营性扭亏，成为首个全球化的中国创新药企  \n  药明康德   全球 CXO 龙头   \"卖水人\"模式，服务全球药企；受地缘政治影响后加速全球多地产能布局  \n  信达生物   PD 1 明星药企   2025 年 2 笔 License out 首付款合计 12.8 亿美元  \n  三生制药   生物药平台   2025 年从辉瑞获约 15 亿美元首付（含股权合作），刷新中国药企单笔首付纪录  \n  科伦博泰   ADC 出海代表   多笔大额授权默沙东，验证中国 ADC 平台能力  \n  迈瑞医疗   医疗器械龙头   监护、超声、IVD 全球化，美国市场与新兴市场双线增长  \n  石药集团   老牌药企转型   自研+License out 双轮，创新药管线丰富  \n\n  📎 参考出处：\n    各公司 2025 年财报与公告\n    医药魔方 NextPharma 数据库\n\n   5. 当前行业格局\n\n  规模与景气（2025 年）：  \n  国家药监局 2025 年全年批准上市创新药 76 个，创历史新高，全球占比约 30%、位居全球第二\n  中国创新药 License out 全年 157 起、总金额 1356.55 亿美元，同比约翻 1.6 倍，  BD 出海金额约占全球 49%，首次超过美国成为全球第一  （部分口径）\n  2026 年上半年延续高景气：对外授权 81 笔、总规模约 1100 亿美元\n\n  竞争态势（三条主线）：  \n    创新药全面出海：   大额首付款（三生 辉瑞 15 亿美元、信达 12.8 亿美元）、里程碑条款成为常态；ADC、双抗、GLP 1 减肥药是跨国药企最愿意买单的中国资产。\n    国内医保谈判常态化：   创新药进医保\"以价换量\"路径成熟，企业从\"拼价格\"转向\"拼临床价值\"；仿制药集采持续压价，倒逼企业向创新与差异化转型。\n    CXO 分化与重构：   全球投融资回暖带动订单回升，但地缘政治（美国生物安全法案博弈）促使 CXO 全球化布局与客户多元化。\n\n一句话格局：  \"国内市场'以价换量'、海外市场'以质换价'；License out 从'少数尝鲜'变成'行业标配'，中国创新药进入全球化收获期。\"  \n\n  📎 参考出处：\n    国家药监局 2025 2026 年药品审批数据\n    医药魔方、Pharma ONE 等第三方数据库\n\n   6. 行业壁垒\n\n    研发周期与资金壁垒（最高）：   一个新药从靶点发现到上市平均 10 年以上、投入 10 20 亿美元级别，且 III 期临床失败即前功尽弃，普通资本难以进入。\n    临床数据壁垒：   全球多中心临床数据是药品国际化的\"入场券\"；早期布局海外临床的企业（百济、恒瑞）已建立先发优势。\n    监管审批壁垒：   NMPA、FDA 等审评标准严格，批文是稀缺资源；临床试验注册、伦理审查、生产 GMP 认证构成系统性门槛。\n    专利与数据独占壁垒：   药品专利、数据保护期决定独家销售窗口，专利悬崖是每个大药企的宿命。\n    商业化与渠道壁垒：   创新药上市后的医院准入、医保谈判、学术推广、医患教育，能力决定药品能否放量；销售网络是仿制药企的护城河。\n    人才壁垒：   高端研发（生物学、临床医学、统计）、注册、BD 授权人才稀缺，海外背景与产业经验双重加持。\n\n  📎 参考出处：\n    医药行业研发成本与周期公开研究\n    各大药企年报研发投入披露\n\n   7. 核心监管机制\n\n  归口部门（多头监管）：  \n    国家药监局（NMPA）  ：药品/器械注册审评、临床试验审批、GMP 认证、上市后监管\n    国家医保局  ：医保目录谈判、药品集中采购（集采）、支付标准制定\n    国家卫健委  ：医院准入、临床用药管理、DRG/DIP 支付改革\n    海关/商务部  ：进出口资质、License out 合规审查\n\n  关键政策法规（近两年主线）：  \n  创新药审评审批提速：优先审评、附条件批准、临床试验默示许可，缩短新药上市周期\n  医保谈判常态化+集采扩围：创新药\"以价换量\"，仿制药大幅降价（最高降幅超 90%）\n  支持创新药全产业链发展政策（2025 年国务院《关于全面深化药品医疗器械监管改革促进医药产业高质量发展的意见》等）\n  DCMM/数据、临床资源、研究者发起的临床研究等配套规范加强\n  医药代表备案制、反商业贿赂（医药反腐）监管趋严\n\n  准入条件提示：   药品上市需完成临床研究与注册审批；生产需 GMP 认证；医院销售需准入谈判与医保对接；License out 涉及跨境知识产权与合规审查。\n\n  📎 参考出处：\n    国家药监局、国家医保局政策文件\n    2025 年国务院促进医药产业高质量发展政策\n\n   8. 行业风险\n\n    研发失败风险（最大）：   III 期临床失败、安全性事件可导致数十亿元投入归零，股价单日腰斩并不罕见。\n    医保控费与集采降价：   创新药谈判大幅降价、仿制药集采\"地板价\"，压缩行业利润空间，倒逼成本控制。\n    出海与地缘政治风险：   FDA 审评不确定性、美国生物安全法案对 CXO 的限制"])</script><script>self.__next_f.push([1,"c:T2779,"])</script><script>self.__next_f.push([1,"金融 Finance 让钱流动起来：银行、证券、保险与财富管理 金融 银行 证券 保险 基金 投行 财富管理 工商银行 招商银行 中信证券 中国平安 中国人寿 易方达/华夏基金 蚂蚁集团/微信支付 中央汇金 \n   1. 行业一句话定义\n\n金融行业是  资金融通的行业：把有钱人的钱、闲钱、长期钱收集起来，配置给需要钱的个人、企业和政府  。通俗说，银行赚\"利差\"（吸收存款、放贷款），证券赚\"交易与服务\"（帮企业融资、帮投资者投资），保险赚\"风险定价\"（收保费、兑赔付），基金与财富管理赚\"管理费\"（帮人管钱）。它是所有实体经济的\"血液系统\"——没有金融，企业融不到资、个人买不了房、国家发不起债。\n\n  📎 参考出处：\n    国务院《关于金融工作情况的报告》（2025 10 26，十四届全国人大常委会第十八次会议）\n    中国人民银行货币政策执行报告\n\n   2. 钱从哪来\n\n金融行业的\"钱\"分几层：\n\n    银行：赚利差与手续费。   核心是\"存款 贷款\"利差（净息差）：吸收存款付利息、放贷收利息，赚中间差价；另收支付、结算、代销等手续费。2025 年 9 月新发放企业贷款加权平均利率约 3.14%（历史低位），银行净息差持续承压，\"以量补价\"与财富管理成为增长点。\n    证券：赚交易佣金、投行承销与自营投资。   股民买卖股票交佣金；企业 IPO/发债由投行承销收费；券商自营（自有资金投资）收益波动大。资本市场活跃度直接决定券商业绩弹性。\n    保险：赚\"三差\"（死差、费差、利差）。   保费收入先于赔付支出形成巨额资金池，通过投资赚取收益；关键能力是对风险（寿命、疾病、事故）的定价与赔付管理。\n    基金与财富管理：赚管理费。   按管理规模（AUM）收取固定比例管理费，规模越大越稳定；买方投顾改革推动从\"销售佣金\"转向\"按资产收费\"。\n    数字金融：赚科技服务与生态钱。   支付（支付宝、微信支付）、消费金融、供应链金融，通过场景与流量变现，是行业最活跃的增量。\n\n一句话总结：  银行赚\"利差与规模\"，证券赚\"市场活跃度\"，保险赚\"风险与投资\"，资管赚\"规模与声誉\"，数字金融赚\"生态与数据\"。   谁在买单？企业（融资成本）、个人（贷款利息与投资费用）、政府（债券）以及全社会承担的风险溢价。\n\n  📎 参考出处：\n    国务院《关于金融工作情况的报告》（2025 10 26）\n    央行、金融监管总局、证监会 2025 年金融运行数据\n\n   3. 产业链上下游\n\n以\"资金供给→金融机构→资金需求\"为主线：\n\n  ① 资金供给端（存款与资金）：  \n  居民与企业存款（银行）、保费（保险）、投资者资金（基金/理财/股民）、中长期资金（养老金、社保、险资）\n\n  ② 资金中介端（金融机构）：  \n  银行（国有大行/股份行/城商行/农商行）→ 贷款与存款\n  券商（投行/经纪/资管/自营）→ 资本市场融资与交易\n  保险（寿险/财险/再保险）→ 风险保障与长期资金\n  基金/理财/信托/融资租赁 → 资产管理\n  支付与金融科技（支付机构、消费金融、互联网银行）→ 交易与普惠\n\n  ③ 基础设施端（支撑体系）：  \n  央行（货币政策与支付系统）、交易所（上交所/深交所/北交所）、征信与评级、清算结算（中登/银联/网联）、监管机构（金融监管总局、证监会、央行）\n\n  ④ 资金需求端（用钱方）：  \n  企业（经营与投资）、个人（消费与购房）、政府（基建与化债）、房地产、新能源、科技创新（科创金融）\n\n   mermaid\nflowchart LR\n  A[资金供给：存款/保费/投资资金]     B[中介：银行·券商·保险·基金]\n  B     C[基础设施：央行·交易所·支付清算]\n  C     D[资金需求：企业/个人/政府]\n  B     E[监管：金融监管总局·证监会·央行]\n   \n\n  📎 参考出处：\n    中国人民银行《中国金融稳定报告》\n    国务院《关于金融工作情况的报告》（2025 10 26）\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  工商银行   全球最大银行   国有大行\"压舱石\"，普惠与信贷投放主力  \n  招商银行   零售银行标杆   财富管理与零售信贷领先，息差韧性较强  \n  中信证券   头部券商   投行与机构业务领先，资本市场改革直接受益  \n  中国平安   综合金融集团   保险产险+寿险+银行+资管，科技投入大  \n  中国人寿   寿险龙头   中长期资金代表，权益配置政策受益  \n  易方达/华夏基金   公募基金龙头   管理规模领先，\"国家队\"与居民理财配置入口  \n  蚂蚁集团/微信支付   数字金融基础设施   支付+消费金融+财富科技，金融科技样本  \n  中央汇金   国家稳定力量   关键时点增持，稳市场机制的重要一环  \n\n  📎 参考出处：\n    各机构公开年报、官网\n    国务院《关于金融工作情况的报告》（2025 10 26）\n\n   5. 当前行业格局\n\n  规模（2025 年 9 月末）：  \n  金融业机构总资产超   520 万亿元  \n  商业银行资本充足率   15.36%  、不良贷款率   1.52%  （风险指标处于稳健区间）\n  保险公司综合偿付能力充足率   186%  ，证券公司风险覆盖率 295%、期货公司 226%（均显著高于监管标准）\n  社融存量同比 +8.7%、M2 同比 +8.4%；9 月新发放企业贷款加权平均利率 3.14%（历史低位）\n\n  结构与发展主线：  \n    适度宽松与降准降息：   2025 年货币政策定调\"适度宽松\"，5 月推新一轮一揽子措施，进一步降准降息，支持科技创新、提振消费、稳定外贸\n    资本市场改革深化：   新\"新国九条 国九条\"与\"1+N\"政策体系落地，2025 年上半年 IPO 48 家、融资约 3802 亿元（同比 +25%）；科创板\"1+6\"制度体系、并购重组改革提升包容性；\"稳股市\"成为政策重心\n    稳市机制常态化：   中央汇金果断出手、社保/险资等中长期资金入市、上市公司回购增持，一批\"稳市组合拳\"落地\n    银行让利实体与息差承压：   LPR 多次下调，银行净息差持续收窄；存款利率同步下调形成对冲，零售银行与财富管理仍是竞争焦点\n    数字金融与金融科技：   支付、消费金融、供应链金融线上化，\"五篇大文章\"（科技/绿色/普惠/养老/数字金融）成为服务实体重点\n\n一句话格局：  \"银行赚规模但息差承压，券商赚市场活跃度，保险赚长期资金红利，数字金融赚生态；政策主线是稳市场、促改革、强监管、支持科技与实体。\"  \n\n  📎 参考出处：\n    国务院《关于金融工作情况的报告》（2025 10 26）\n    证监会、央行 2025 年政策文件与市场数据（A股 IPO 数据等）\n\n   6. 行业壁垒\n\n    牌照壁垒（最硬）：   金融是强牌照行业——银行、券商、保险、基金、支付均需监管机构审批牌照；牌照稀缺且监管严禁无照经营，是行业最核心的护城河。\n    资本与规模壁垒：   银行资本充足率、券商净资本要求决定业务上限；做大规模才能摊薄系统、网点与合规成本。\n    客户与信任壁垒（最隐性）：   金融卖的是\"信任\"——存款人、投保人、投资者用脚投票；品牌、网点、历史业绩与监管记录构成长期信任资产（\"零售之王\"招行的护城河即在此）。\n    人才与牌照组合壁垒：   高端投行、资管、量化、风险管理人才高度稀缺；牌照+团队+客户资源的组合难以复制。\n    科技与数据壁垒（新）：   支付、风控、反欺诈、量化交易依赖数据与算法；头部机构科技投入形成效率优势（蚂蚁、招行的数字化是样本）。\n\n  📎 参考出处：\n    《中华人民共和国商业银行法》《证券法》《保险法》《证券投资基金法》等\n    金融监管总局、证监会准入管理规定\n\n   7. 核心监管机制\n\n  归口部门（\"一行一局一会\"）：  \n    中国人民银行  ：货币政策（利率、准备金）、支付体系、宏观审慎管理\n    国家金融监督管理总局  ：银行、保险、信托、消费金融等机构监管\n    中国证监会  ：证券、期货、基金与资本市场统一监管\n  地方金融管理局协同监管类金融组织\n\n  关键政策法规（近两年主线）：  \n  新\"国九条\"（2024 04）与资本市场\"1+N\"政策体系：加强监管、防范风险、促进高质量发展\n  《金融稳定法》（推进制定）：构建金融风险处置与稳定保障机制\n  适度宽松货币政策（2025）：多次降准降息，优化支持资本市场两项货币政策工具\n  资本新规（2024 年起实施）：差异化资本监管，引导银行服务实体\n  保险与长期资金入市政策：扩大保险资金长期投资试点（2025 年拟再批复 600 亿元）\n  债券\"科技板\"与科技创新债券：支持科技企业融资（近 500 家机构计划发行超 3000 亿元科创债）\n\n  准入条件提示：   设立金融机构需牌照审批；从业人员需资格（证券从业、基金从业、银行从业等）；私募基金需登记备案；金融业务互联网展业需持牌合规（\"金融业务必须持牌\"是铁律）。\n\n  📎 参考出处：\n    中国人民银行、金融监管总局、证监会 2025 年新闻发布与政策文件（\"一行一局一会\"负责人发声，2025 05 07）\n    国务院《关于金融工作情况的报告》（2025 10 26）\n\n   8. 行业风险\n\n    信用风险（最基础）：   贷款/债券违约——2025 年 9 月末商业银行不良贷款率 1.52%，房地产、地方平台领域仍是关注重点。\n    市场风险：   利率、汇率、股"])</script><script>self.__next_f.push([1,"d:T24c8,"])</script><script>self.__next_f.push([1,"消费电子 Consumer Electronics 手机、PC、可穿戴：离消费者最近的硬件 消费电子 手机 可穿戴 苹果 华为 小米 供应链 苹果 华为 小米 vivo OPPO（含一加） 荣耀 三星 立讯精密/歌尔股份 \n   1. 行业一句话定义\n\n消费电子行业是  面向大众消费者设计、制造和销售电子硬件的行业  ：手机、电脑、平板、耳机、手表、智能家居，以及正在起势的 AI 眼镜、AR/VR 等新形态设备。通俗说，它是\"离消费者最近的硬件生意\"——卖的是\"体验+生态\"，赚的是\"产品力+品牌+供应链效率\"。过去十年行业靠\"换机潮\"增长，现在靠\"AI、折叠屏与新形态\"驱动结构升级。\n\n  📎 参考出处：\n    IDC《中国季度手机市场跟踪报告》\n    Counterpoint Research 中国智能手机市场季度数据\n\n   2. 钱从哪来\n\n消费电子的\"钱\"分几层：\n\n    硬件销售：卖设备。   手机/PC/平板按\"定价 成本\"赚毛利。高端机毛利高（苹果硬件毛利率约 40%+，国产旗舰 20 30%），低端机靠走量。2025 年中国智能手机市场在\"国补\"补贴推动下回暖（2025 年出货预计约 2.89 亿部，同比 +1.6%，部分机构口径 +3%）。\n    生态与服务：卖软件与订阅。   应用商店抽成（苹果税）、云服务、广告、配件与 IoT 联动，\"后手机时代\"硬件公司都在讲\"生态收入\"故事——苹果服务收入已占总营收约四分之一，小米\"人车家\"生态互联也为此布局。\n    AI 与新形态溢价：卖升级。   端侧AI（AI 手机、AI PC）、折叠屏、卫星通信成为新卖点，驱动用户\"换机\"——手机从\"能用\"到\"好用+智能\"，愿意为 AI 体验多付钱。2025 年 Q1 中国折叠屏出货 284 万台、同比 +53.1%。\n    供应链与代工：卖制造能力。   代工厂（富士康、立讯精密、歌尔股份）赚\"加工费\"+零部件利润；供应链（面板京东方、内存、电池、结构件）赚\"卡位\"钱。苹果链的\"果链\"模式是样板：量大、要求严、利润尚可。\n\n一句话总结：  终端卖\"体验与品牌\"，AI/折叠屏卖\"溢价\"，生态卖\"长尾\"，供应链卖\"效率\"。   谁在买单？最终是消费者的换机预算——所以\"换机周期\"与消费信心是行业的生命线。\n\n  📎 参考出处：\n    IDC《中国季度手机市场跟踪报告》（2025 各季度）\n    Counterpoint、TechInsights 中国手机市场数据（2025）\n\n   3. 产业链上下游\n\n以\"芯片→组装→品牌→消费者\"为主线：\n\n  ① 上游（核心零部件）：  \n  芯片（SoC：苹果 A 系/麒麟、高通骁龙、联发科天玑；存储、面板驱动 IC）\n  屏幕（京东方、三星显示、TCL华星）、内存（三星/海力士/美光/长江存储）\n  结构件与新材料（钛合金、玻璃、陶瓷）、电池、摄像头模组（舜宇、韦尔）\n  被动件与 PCB（鹏鼎控股、东山精密）\n\n  ② 中游（设计与制造）：  \n  ODM/代工：富士康、立讯精密、歌尔股份、闻泰科技\n  品牌方：苹果、华为、小米、vivo、OPPO、荣耀、三星、传音（新兴市场）\n\n  ③ 下游（渠道与服务）：  \n  线上（京东、天猫、拼多多、抖音电商）+ 线下（授权店、运营商渠道）\n  售后与回收（以旧换新、二手机市场）\n\n  ④ 新形态与生态：  \n  AI 眼镜（Meta Ray Ban 等、雷鸟、星纪魅族）、AR/VR、智能手表/手环、智能家居、汽车座舱（手机厂商跨界）\n  操作系统与 AI 生态：鸿蒙、澎湃 OS、ColorOS 等自研系统 + 端侧大模型\n\n   mermaid\nflowchart LR\n  A[上游：芯片·屏幕·结构件·模组]     B[中游：ODM代工+品牌设计]\n  B     C[渠道：线上+线下]\n  C     D[消费者/生态升级]\n  B     E[新形态：AI眼镜/折叠屏/AIoT]\n  E     D\n   \n\n  📎 参考出处：\n    各环节代表公司公开年报与招股书\n    IDC、Counterpoint 产业链数据与拆解报告\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  苹果   高端与生态标杆   全球利润最高的手机公司；中国区高端份额承压（600 美元以上份额从 23.4%→17%）  \n  华为   2025 年中国市场第一（部分季度份额 18 20%）   麒麟+鸿蒙全自研回归，折叠屏市占率超 76%（Q1）  \n  小米   中国市场头部品牌（份额约 16 19%）   \"人车家全生态\"，徕卡影像+端侧 AI  \n  vivo   影像路线代表，头部品牌   蔡司联合影像，X 系列高端拉升  \n  OPPO（含一加）   折叠屏与影像创新主力   Find N 系列引领折叠屏轻薄化  \n  荣耀   独立后快速复苏   自研体系+海外全球化  \n  三星   全球出货量第一   折叠屏（Galaxy Z 系列）与供应链（屏幕/存储）双强  \n  立讯精密/歌尔股份   果链与 AIoT 代工龙头   供应链\"卡位\"样本，绑定苹果、Meta 等大客户  \n\n  📎 参考出处：\n    各品牌官方出货公告与 IDC/Counterpoint/TechInsights 数据（2025 年各季度中国/全球市场）\n\n   5. 当前行业格局\n\n  规模（2025 年）：  \n  全球智能手机出货约 2.9 亿台/季度量级，增量有限但结构升级；中国 2025 年出货预计 2.89 亿部（+1.6%~3%）\n  中国折叠屏 2025 年出货预计约 1000 1200 万台（同比 +8%~大幅增长），华为份额超 76%（Q1）\n  高端（600 美元+）份额升至约 30%，高于 2018 年的 11%——\"高端化+AI\"是增长主线\n\n  竞争态势：  \n    中国市场竞争格局（2025）：   华为登顶（麒麟回归+鸿蒙生态+国补受益）、小米紧随其后、vivo/OPPO/荣耀居中、苹果承压（创新放缓+AI 功能缺位，从第一跌出前五边缘）；整体市场微增，头部集中度提升\n    AI 成为分水岭：   端侧 AI（语音助手、生成式 AI、AI 摄影）成为新机核心卖点；苹果因 AI 功能缺失在中国区承压，中国厂商率先把大模型装进手机\n    折叠屏从小众到主流：   完成\"从尝鲜到规模竞争\"跨越，华为、OPPO、荣耀、三星多线竞争，折痕、铰链、轻薄是技术焦点\n    生态竞争白热化：   手机厂商跨界\"人车家\"（小米汽车、华为智选车、苹果 Vision Pro 生态），从\"卖手机\"转向\"卖全场景\"\n    供应链与关税风险：   美国关税政策冲击全球供应链，苹果被施压将产能转移至美国本土，供应链全球化面临重构\n\n一句话格局：  \"总量微增、结构升级；AI 与折叠屏决定品牌座次，生态与供应链效率决定利润。\"  \n\n  📎 参考出处：\n    IDC《中国季度手机市场跟踪报告》（2025）\n    Counterpoint Research 中国智能手机市场季度数据（2025）\n    TechInsights 2025 年第一季度中国手机市场报告\n\n   6. 行业壁垒\n\n    技术与研发壁垒（最硬）：   芯片（华为麒麟自研、苹果 A 系）、屏幕、影像算法、AI 大模型端侧部署——没有核心技术就无法做高端（苹果生态与华为自研是样本）。\n    品牌与渠道壁垒：   消费电子是\"信任品\"——品牌、口碑、渠道覆盖决定销量；新品牌（小米当年、传音出海）要么靠极致性价比+线上，要么靠垂直市场（非洲）切入。\n    供应链管理壁垒（最关键）：   苹果模式的精髓是\"供应链管理\"：品质、成本、交付三线平衡；果链企业（立讯、歌尔）用十几年积累的工艺与认证壁垒让新玩家难以复制。\n    生态与系统壁垒（长期）：   iOS/鸿蒙/安卓生态、账号体系、跨设备协同（手机 PC AIoT 汽车）构成用户黏性；换机成本≈生态迁移成本。\n    规模与资金壁垒：   研发投入百亿级（苹果年研发超 300 亿美元），渠道与营销费用巨大，小厂商只能在细分市场（游戏手机、三防机）生存。\n\n  📎 参考出处：\n    各公司年报披露研发投入\n    行业研报对消费电子竞争壁垒的分析（IDC、Counterpoint 等）\n\n   7. 核心监管机制\n\n  归口部门：  \n    工业和信息化部  ：电信设备进网许可、无线电（卫星通信）管理、软件生态\n    市场监管总局  ：3C 认证（CCC）、消费者权益保护、价格行为\n    国家网信办/数据局  ：App 合规、个人信息保护（《数据安全法》《个人信息保护法》）\n    商务部  ：出口管制与贸易政策（芯片、技术）\n\n  关键政策法规：  \n  3C 认证与进网许可：手机等设备上市需强制认证，无认证不得销售\n  《个人信息保护法》：App 权限、数据收集边界的强监管（工信部常态化 App 通报整改）\n  消费品\"以旧换新\"与国补政策：2025 年购机补贴直接拉动销量，是行业最大短期政策变量\n  出口管制：高端芯片与技术出口限制（中美科技博弈直接影响华为、中芯国际等）\n\n  准入条件提示：   终端上市需 3C+进网+无线电型号核准；App 与系统需通过备案与隐私合规审查；AI 生成内容需算法备案与内容安全审核。\n\n  📎 参考出处：\n    工信部电信设备进网管理与认证规定\n    市场监管总局 3C 认证目录与要求\n    网信办算法备案、App 违规通报政策\n\n   8. 行业风险\n\n    需求与换机周期风险（最基础）：   中国市场换机周期已拉长至 3 年以上"])</script><script>self.__next_f.push([1,"e:T265b,"])</script><script>self.__next_f.push([1,"物流快递 Logistics 把货从 A 搬到 B：规模、网络与时效的生意 物流 快递 顺丰 京东物流 菜鸟 同城配送 供应链 顺丰控股 中通快递 圆通速递 韵达股份 申通快递 极兔速递 京东物流 菜鸟 \n   1. 行业一句话定义\n\n物流快递行业是  把\"货\"从生产端运到消费端的服务行业  ，核心是解决\"空间位移+时间效率\"的问题。它不是一个高毛利行业，而是一个  拼规模、拼网络、拼效率的规模经济行业  ：单票利润极薄（几分到几毛钱），靠的是每天上亿件包裹的体量摊薄成本。\n\n按业态分：  快递  （电商件为主，通达系）与  时效件  （顺丰），  快运  （大件、零担），  同城配送  （外卖、即时零售），  供应链物流  （仓配一体，京东物流），  国际物流  （跨境快递与货运，菜鸟、极兔）。电商是中国快递最大的需求来源——2025 年上半年全国快递业务量 956.4 亿件，意味着平均每天约 5 亿件包裹在路上。\n\n  📎 参考出处：\n    国家邮政局 2025 年邮政行业运行情况\n    各快递公司 2025 年半年报/三季报\n\n   2. 钱从哪来\n\n物流快递的\"钱\"分四层：\n\n    快递费（最核心）：   按票收费。2025 年上半年全国快递业务收入 7187.8 亿元（+10.1%），但单票均价仅 7.5 元、同比下降 8%——\"量增价减\"是近年最显著的特征。通达系单票收入 2 元上下（圆通 2.18 元、申通 2.02 元、韵达 1.94 元），顺丰靠时效与品牌卖到单票 13.83 元。\n    时效件与企业件：   顺丰的核心地盘：商务件、高端电商件、供应链解决方案，单价数倍于电商件，利润率高。\n    供应链与仓配服务：   京东物流式\"仓储+运输+配送\"一体，向品牌客户收供应链服务费，客单价高、粘性强。\n    国际与跨境物流：   跨境电商（Temu、SHEIN 等）高速增长带来跨境专线、海外仓、小包业务增量，是增速最快的细分战场。菜鸟、极兔、顺丰国际都在加码。\n    增值服务：   保价、代收货款、冷链、医药、同城急送等，单票价值更高。\n\n一句话总结：  \"电商件赚规模与效率，时效件赚品牌与溢价，供应链赚深度服务，跨境赚全球化红利。\" 谁能把单票成本做得更低、服务做得更稳，谁就能在'量增价减'里活下来。  \n\n  📎 参考出处：\n    国家邮政局 2025 年月度行业数据\n    顺丰、圆通、申通、韵达 2025 年三季报\n\n   3. 产业链上下游\n\n以\"揽收—中转—运输—派送\"为主线：\n\n  ① 上游（生产要素）：  \n  车辆（干线重卡、支线车、新能源三轮车）、燃油/充电、智能仓储设备、分拣自动化装备\n  信息系统：路由规划、调度、轨迹、电子面单\n  劳动力：快递员、分拣员、司机（人力是第一大成本）\n\n  ② 中游（网络运营）：  \n  快递总部（网络规划、干线运输、分拨中心）→ 加盟商/直营网点 → 驿站/快递柜（末端）\n  运输网络分三层：干线（城市间）、支线（城市内）、末端（最后三公里）\n\n  ③ 下游（需求方）：  \n  电商平台/商家（最大需求来源）、品牌企业（供应链物流）、个人寄件、跨境电商卖家\n  消费者是最终买单者（运费内含于商品价格或单独支付）\n\n   mermaid\nflowchart LR\n  A[上游：车辆·设备·人力·信息系统]     B[揽收]\n  B     C[分拨中心]\n  C     D[干线运输]\n  D     E[到达分拨]\n  E     F[支线/末端派送]\n  F     G[消费者/驿站]\n  G     H[电商/商家/企业客户]\n   \n\n  📎 参考出处：\n    快递公司年报运营数据\n    国家邮政局快递服务时限调查\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  顺丰控股   时效件之王、A股物流市值龙头   2025 上半年营收 1468.58 亿元；航空+直营+科技三张牌，前三季度归母净利 83.1 亿元（+9.1%） \n  中通快递   业务量第一   份额约 19%，行业首家日均件量破亿；成本效率行业的\"隐形冠军\"  \n  圆通速递   通达系第二   2025 前三季度业务量 226 亿件（份额 15.6%）；数字化+自有航空机队  \n  韵达股份   通达系第三   前三季度业务量 191 亿件（13.2%）；价格竞争下盈利承压、主动调结构  \n  申通快递   通达系追赶者   前三季度业务量 189 亿件（13.0%）；Q3 单票扣非净利环比转正  \n  极兔速递   东南亚+中国双线   2025 前三季度中国业务量 162 亿件（11.1%）；跨境网络是差异化优势  \n  京东物流   供应链物流代表   仓配一体+一体化供应链，外部客户收入占比持续提升  \n  菜鸟   阿里物流科技平台   跨境物流、全球驿站网络、菜鸟速递自营，链接电商生态  \n\n  📎 参考出处：\n    各公司 2025 年半年报/三季报\n    国家邮政局快递品牌发展情况\n\n   5. 当前行业格局\n\n  规模（2025 年）：  \n  2025 年上半年全国快递业务量 956.4 亿件、同比 +19.3%；业务收入 7187.8 亿元、+10.1%；  单票均价 7.5 元、同比  8%  ——量增价减贯穿全年\n  2025 年前三季度行业件量增速 17.2%（Q3 单季 +13.3%）；行业快递收入 10857.4 亿元、+8.9%\n  头部高度集中：2025 前三季度份额上，中通约 19%（全年口径）、圆通 15.6%、韵达 13.2%、申通 13.0%、极兔 11.1%、顺丰 8.3%，  前六强合计约 80%  \n\n  竞争态势（三条主线）：  \n    量增价减与\"反内卷\"：   低价竞争压到单票利润临界点后，2025 年 Q3 起行业出现\"反内卷\"信号：单票收入环比回升（申通 Q3 单票扣非净利 +0.015 元、圆通环比 +0.012 元），利润弹性开始释放。\n    分层竞争：   顺丰守高端（时效件+供应链），通达系拼电商件成本效率，极兔攻性价比与跨境，京东物流/菜鸟做一体化供应链——赛道分层、错位竞争。\n    时效与服务质量比拼：   从\"价格战\"转向\"时效战\"：72 小时妥投率维持 85% 以上高位，行业竞争维度从价格扩展到时效、破损率、末端体验。\n\n一句话格局：  \"量增价减见底、份额高度集中、价格战转向效率与服务战；'反内卷'后单票利润修复是近两年投资与就业观察的核心变量。\"  \n\n  📎 参考出处：\n    国家邮政局 2025 年月度/年度数据\n    券商快递行业三季报综述（2025）\n\n   6. 行业壁垒\n\n    网络规模壁垒（最核心）：   网点密度×分拨中心×干线线路构成网络，件量规模决定单票成本；日均亿件（中通）与百万件的成本差距是数量级的。网点覆盖越广，时效与服务越好，形成正反馈。\n    资本壁垒：   分拨自动化设备、干线车队（顺丰自有飞机 100+ 架）、仓储园区是重资产投入；转运自动化水平决定效率天花板。\n    运营与管理壁垒：   加盟制网络的利益分配、末端管控、质量一致性极难复制；网络治理能力是通达系的核心竞争力。\n    数据与技术壁垒：   路由优化、预测调度、动态定价需要海量数据与算法；菜鸟、京东物流的数据能力构成差异化。\n    品牌与信任壁垒：   顺丰的\"快+稳\"品牌心智、京东物流的\"次日达\"体验，是长期投入建立的护城河。\n\n  📎 参考出处：\n    快递公司年报资本开支与运营数据\n    行业研报对快递网络规模效应的分析\n\n   7. 核心监管机制\n\n  归口部门：  \n    国家邮政局  ：快递业务经营许可、服务质量监督、市场秩序（价格战监管）、申诉处理\n    市场监管总局  ：反垄断、价格行为监管（低价倾销认定）\n    交通运输部  ：道路货运、车辆管理、干线运输安全管理\n    生态环境部  ：快递包装绿色治理（限塑、过度包装）\n\n  关键政策法规（近两年主线）：  \n  《快递市场管理办法》修订：末端投递规则（不得擅自改变投递方式）、服务质量要求\n  \"快递进村\"工程：推动快递服务下沉农村，村级寄递物流体系成为政策重点\n  快递包装绿色转型：推进可循环包装、禁止过度包装（2025 年新版限用一次性塑料制品）\n  \"反内卷\"治理：对无底线价格战、低价倾销的监管与行业自律（2025 年出现明显信号）\n  灵活用工与劳动者权益：快递员社保、劳动保障、职业伤害保障试点扩大\n\n  准入条件提示：   经营快递业务需取得快递业务经营许可证（省级以上邮政管理部门核发）；加盟网点需备案；跨境业务需具备相应进出口与清关资质。\n\n  📎 参考出处：\n    《快递市场管理办法》及国家邮政局规章\n    快递行业\"快递进村\"\"绿色包装\"政策文件\n\n   8. 行业风险\n\n    价格战与盈利风险：   低价竞争压缩单票利润（韵达 2025 前三季度归母净利同比下降 48.2%），弱势玩家持续失血；\"反内卷\"能否持续决定行业利润修复。\n    劳动力成本与用工风险：   人力占成本大头，快递员招工难、社保合规成本上升；高峰期的用工波动影响时效。\n    电商增长放缓：   快递高度依赖电商件，电商增速（尤其低价电商）回落将直接冲击业务量。\n    油价与运营成本：   干线运输成本与油价高度相关，油价上涨侵蚀利润。\n    末端稳定性风险：   快递员流动性大、驿站与柜的体验争议（新规后的投递方式争议）、末端网点经营压力。\n    安全与合规风险：   违禁品、\"毒快递\"、个人信息泄露、跨境合规（报关、税务）问题。"])</script><script>self.__next_f.push([1,"f:T2640,"])</script><script>self.__next_f.push([1,"教育培训 Education \u0026 Training 教育：政策敏感、需求刚性的成长生意 教育培训 K12 职业教育 考研 素质教育 新东方 中公教育 新东方 好未来 华图山鼎 中公教育 粉笔 \n   1. 行业一句话定义\n\n教育培训行业是  为\"升学、考试、求职、技能提升\"提供知识服务的行业  ，本质卖的不是产品而是\"结果预期\"——提分、上岸、拿证、就业。它是一个  政策敏感度极高、需求却又高度刚性  的行业：政策一纸文件可以改变一条赛道（双减），但\"人想变得更好\"的需求永远存在。\n\n按需求对象分两大块：  面向 K12 学生  （学科培训已大幅出清、素质教育/学习设备兴起）与  面向成人与职业教育  （考研、考公、职业证书、IT、语言、学历提升）。2026 年的行业重心明显偏向后者：2025 届高校毕业生 1222 万人，就业压力越大，考公、考研、技能培训的付费意愿越强。\n\n  📎 参考出处：\n    教育部《2025届全国普通高校毕业生就业创业工作通知》\n    中研网、艾瑞咨询等职教行业市场规模分析\n\n   2. 钱从哪来\n\n教育培训的\"钱\"来自  个人/家庭的教育支出  ，按赛道分：\n\n    公务员/编制考试培训（当前最热）：   就业承压→考公热。2025 年国考报名 341.6 万人（同比 +12.63%），招录约 4 万人，竞争比约 86:1；另一口径显示国考报名 371.8 万人、首次超过考研报名 343 万人。\"上岸焦虑\"直接转化为培训付费：公考三巨头 2024 年收入华图山鼎 27.91 亿元   中公 25.64 亿元   粉笔 23.41 亿元。\n    K12 学科培训（双减后受限）：   义务教育阶段学科类校外培训不再新批营利性机构，存量市场大幅收缩；高中阶段从严但未完全禁绝；转型方向是素质教育、学习硬件与进校服务。\n    素质教育与兴趣培训（政策鼓励）：   非学科类培训（体育、艺术、科技/编程）牌照常态化审批恢复，2025 年 1 月新增审批数量同比 +15.4%，成为机构转型的主要承接赛道。\n    考研培训：   考研报名 343 万人（已被国考超越但仍在高位），公共课、专业课、复试调剂培训需求稳定。\n    职业教育与技能培训：   财会、IT、教资、法考、医考、语言等证书与技能赛道长尾分散；中国职业教育市场规模 2016 年约 5167 亿元 → 2021 年 7811 亿元，预计 2026 年约 1 万亿元。\n    学历继续教育：   专升本、成人高考、自考等学历提升赛道，面向存量职场人。\n\n一句话总结：  \"考公考研吃就业焦虑红利，素质教育吃政策鼓励红利，AI 教育吃技术降本红利；谁能把'结果交付'做到可信，谁就有定价权。\"  \n\n  📎 参考出处：\n    国家公务员局 2025 年度国考报名数据\n    各公司 2024 年报/2025 年一季报\n    职教行业市场规模统计口径（中研普华、艾瑞等）\n\n   3. 产业链上下游\n\n以\"内容研发—教学交付—获客转化—结果验证\"为主线：\n\n  ① 上游（生产要素）：  \n  教研与师资：课程设计、教材教辅、名师/普通教师供给（师资是第一生产力）\n  内容与IP：题库、讲义、视频课程、独家方法论\n  技术与平台：教学系统、直播工具、AI 答疑/批改、学习机硬件供应链\n  场地与牌照：线下校区场地、办学许可证等资质\n\n  ② 中游（服务机构）：  \n  直营校区（新东方、学而思网点）、加盟/合作网点、纯在线平台（粉笔、作业帮、网易有道）\n  交付模式分三种：线下班课、线上直播/录播、AI 助教+真人混合\n\n  ③ 下游（需求方）：  \n  学生与家长（K12 决策权在家长）、大学生与职场人（成人自主决策）\n  企业客户（企业培训、ToB 内容方案）、学校（进校服务、课后服务）\n  最终出口是\"升学结果\"与\"就业结果\"，因此高校扩招、考编招录计划、就业市场状态直接决定需求强弱\n\n   mermaid\nflowchart LR\n  A[上游：教研师资·内容IP·AI技术·场地资质]     B[课程研发]\n  B     C[教学交付：线下班课/线上直播/AI混合]\n  C     D[获客转化：销售·私域·直播·口碑]\n  D     E[学生/家长/职场人]\n  E     F[升学结果/上岸结果/就业结果]\n  F     G[复购与转介绍]\n   \n\n  📎 参考出处：\n    行业通识结构整理\n    上市公司年报中的商业模式描述\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  新东方   教培老牌龙头   出国留学+大学业务基本盘稳固，东方甄选直播电商转型后集团营收重回增长  \n  好未来   K12 学科时代龙头   双减后转向学习机（学而思学习机）、素质教育与 ToB 内容服务，硬件+内容模式初见规模  \n  华图山鼎   考公培训第一梯队   2024 年营收 28.33 亿元（+1046%）、2025Q1 营收 8.27 亿元（+20%）净利 1.21 亿元（+70%），吃足考公热  \n  中公教育   考公培训曾经的王   2020 年营收 112 亿元、巅峰市值 2600 亿元；协议班退费危机后大幅收缩、转直营与降杠杆  \n  粉笔   在线职教代表   线上题库+直播课起家，AI 老师累计会话超 4000 万次、日活 22 万；AI 刷题系统班 2025H1 销售额 1600 万元  \n  网易有道   在线教育与 AI 硬件   有道词典笔等 AI 学习硬件+成人课程，AI 能力是差异化卖点  \n  作业帮   K12 在线教育巨头   双减后转向学习机、素质教育与进校服务，流量与技术基础深厚  \n\n  📎 参考出处：\n    各公司 2024 年报与 2025 年季报\n    公司官方发布与新闻稿\n\n   5. 当前行业格局\n\n  规模与结构（2025 2026）：  \n  中国职业教育市场规模约 7800 8000 亿元（2021 年口径），预计 2026 年逼近 1 万亿元；K12 学科培训在双减后从数万亿级萎缩至合规存量\n  考公赛道逆周期增长：2025 年国考报名 341.6 万人（+12.63%）、竞争比 86:1；公考三巨头 2024 年收入合计超 76 亿元，华图山鼎增速（+1046%）远超行业\n  非学科（素质）培训牌照审批常态化：2025 年 1 月新增 +15.4%，机构\"双减后转型承接赛道\"的复苏信号明确\n\n  竞争态势（三条主线）：  \n    考公考研\"卷\"出来的红利：   就业越难、招录越热，公务员/编制培训成为逆周期最确定的赛道；头部公司从价格战转向\"上岸率+服务交付\"竞争。\n    AI 重塑教学供给：   粉笔 AI 老师、作业帮/学而思学习机、AI 批改与个性化推送，把内容边际成本打下来；AI 在答疑、督学、测评环节开始替代真人助教。\n    线上线下一体化：   纯线下（中公早期重资产直营）与纯线上（粉笔）都在向\"AI+直播+线下场景\"混合模式收敛；获客成本（流量、直播投流）成为决定盈利的关键变量。\n\n一句话格局：  \"K12 学科时代终结后，行业重心转移到考公考研与素质教育；考公热提供确定性，AI 提供杠杆，谁能控住获客成本与交付口碑，谁就是下一轮赢家。\"  \n\n  📎 参考出处：\n    国家公务员局数据、公司年报\n    职教行业研究报告（艾瑞、多鲸等）\n\n   6. 行业壁垒\n\n    品牌与口碑壁垒（最核心）：   教育决策重信任，\"上岸率\"\"提分效果\"沉淀的品牌心智一旦建立，复购与转介绍成为低成本获客来源；新东方\"名师\"、中公\"协议班\"都是历史积累的品牌资产。\n    教研与内容壁垒：   题库、讲义、方法论的积累需要十年级别的时间与投入；内容质量决定交付效果，是差异化的根基。\n    师资与组织壁垒：   好老师是稀缺资源，如何标准化培养、激励与留存（名师出走是行业长期痛点）构成组织能力壁垒。\n    合规与牌照壁垒：   办学许可证、培训资质、资金监管使无证机构被清退，合规成本抬高了新进入者门槛。\n    数据与技术壁垒：   亿级题库数据、用户学习行为数据支撑 AI 个性化教学；粉笔、作业帮的算法资产正在转化为成本与体验优势。\n    现金流与资金壁垒：   预收费模式（一旦爆雷即引发退费挤兑）+ 重校区租金与人力，资本与现金流管理能力决定生死。\n\n  📎 参考出处：\n    行业通识与上市公司商业模式分析\n    《校外培训管理条例（征求意见稿）》相关解读\n\n   7. 核心监管机制\n\n  归口部门：  \n    教育部  ：统筹校外培训监管、学科类培训认定、非学科类培训分类管理\n    各省教育厅/市教委  ：办学许可审批、培训材料备案、资金监管账户\n    市场监管总局  ：价格行为、广告宣传（虚假宣传\"保过\"\"包过\"查处）\n    人社部  ：职业技能培训机构管理、职业资格证书规范\n\n  关键政策法规（近两年主线）：  \n    \"双减\"政策（2021 年）延续：   义务教育阶段学科类校外培训禁止营利性机构新批、压减存量；高中阶段从严管理。这是过去五年重塑行业的最大变量。\n    《校外培训管理条例（征求意见稿）》：   把校外培训管理从\"运动式治理\"转向\"常态化法治化\"，明确非学科类培训准入与监管规则。\n    非学科类培训牌照常态化审批：   素质教育（体育、艺术、科技）恢复合规供给，成为机构转型的官方出口。\n    预收费资金监管：   \"先学后付\"\"一课一消\"与资金监管账户制度，防止爆雷退费潮（中公危机的制度回应）。\n    教育数字化政策：   教育部等九部门发布教育数字化发"])</script><script>self.__next_f.push([1,"10:T26e5,"])</script><script>self.__next_f.push([1,"房地产与建筑 Real Estate \u0026 Construction 从高杠杆扩张到存量经营：最大周期行业的转身 房地产 建筑 物业 保障房 万科 保利 建材 万科 保利发展 华润置地 中海地产 贝壳 绿城中国 \n   1. 行业一句话定义\n\n房地产行业是  围绕\"土地—房子—居住\"展开的重资产周期行业  ，核心环节是买地、开发、建设、销售、交付与后期运营。它一度是中国经济的\"压舱石\"：土地财政、上下游建材家电、居民资产都在此汇聚；如今正从\"高杠杆、快周转\"的扩张时代，转向\"止跌回稳、存量经营\"的新阶段。\n\n建筑行业是房地产的直接施工方，也包含基建、市政、装修等更大范围：2025 年全国房地产开发投资 8.28 万亿元（同比  17.2%），商品房销售面积 8.81 亿平方米、销售额 8.39 万亿元，仍是一个以十万亿计的巨型产业，只是从高速增长切换为筑底修复。\n\n  📎 参考出处：\n    国家统计局 2025 年全国房地产市场基本情况\n    中指研究院、克而瑞等行业月度数据\n\n   2. 钱从哪来\n\n房地产的\"钱\"本质是  居民购买力+金融杠杆  的组合，分四个层次：\n\n    商品房销售收入（最核心）：   新房（期房与现房）销售额 2025 年约 8.39 万亿元，占行业现金流大头；居民按揭贷款是最大资金来源——购房者支付首付、银行放贷，开发商回笼资金滚动开发。\n    开发融资：   银行开发贷、债券、信托、股权融资（房企上市/配股）。融资成本直接决定利润：央企融资成本 3% 4%，民企高峰时 8% 10%+。\n    经营性业务收入：   物业（万物云、碧桂园服务）、商业地产（华润万象城租金）、长租公寓、写字楼与酒店运营——这是\"存量经营\"时代的稳定现金流来源。\n    政府端与资产证券化：   土地出让金是地方政府收入大头（虽在下降）；公募REITs 让持有型物业（保障房、物流园、消费基础设施）实现资产退出，是行业未来重要的资金出口。\n\n一句话总结：  \"开发时代靠'卖期房+高杠杆'滚动，存量时代靠'租金+服务+REITs'变现；融资成本与去化速度决定生死。\"  \n\n  📎 参考出处：\n    国家统计局 2025 年销售与开发投资数据\n    房企年报与公开融资数据\n\n   3. 产业链上下游\n\n以\"拿地—开发—销售—交付—运营\"为主线：\n\n  ① 上游（生产要素）：  \n  土地（地方政府供给，土拍定价）、金融（银行开发贷/按揭）、建筑材料（钢材、水泥、玻璃，化工与新材料行业下游）、建筑劳务\n  建筑设计、工程总包与施工（保利物业在建、中国建筑等建筑业巨头）\n\n  ② 中游（开发与运营）：  \n  开发商（住宅开发、商业地产、产业地产）、物业公司（在管面积与增值服务）、房产经纪平台（贝壳、我爱我家）\n  代建模式兴起（绿城管理）：不拿地、只输出品牌与工程管理，轻资产化\n\n  ③ 下游（需求方）：  \n  购房者（自住/改善/投资）、租房者、企业租户（写字楼/园区）\n  政府（保障性住房、城市更新、公共设施建设）\n  存量时代新下游：城市更新、老旧小区改造、物业管理、长租公寓运营商\n\n   mermaid\nflowchart LR\n  A[上游：土地·金融·建材·施工]     B[拿地/融资]\n  B     C[开发建设]\n  C     D[销售/预售]\n  D     E[交付入住]\n  E     F[物业·商管·租赁·城市更新]\n  F     G[存量经营与REITs退出]\n   \n\n  📎 参考出处：\n    行业通识结构整理\n    房企与建筑上市公司年报\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  保利发展   央企地产龙头   销售规模长期前三，融资成本低、拿地纪律强，稳健度过行业下行  \n  万科   行业曾经的\"优等生\"   业务横跨开发+万物云物业+泊寓租赁，2024 2025 年经历化债与收缩考验  \n  华润置地   商业地产+开发双轮   万象城系列购物中心贡献稳定租金现金流，央企信用优势  \n  中海地产   利润率标杆   行业毛利率最高梯队，低杠杆、财务纪律严，央企背景抗周期  \n  绿城中国   产品力标杆   高端改善产品+代建（绿城管理），在改善需求主导的市场有品牌溢价  \n  贝壳   交易服务龙头   二手房+新房+家装+租赁多赛道，掌握房产交易最大流量入口  \n  万物云   物业行业龙头   万科旗下，社区物业+商企服务+城市空间运营，存量现金流代表  \n\n  📎 参考出处：\n    各公司 2024 2025 年报与公开资料\n    克而瑞房企销售排行榜\n\n   5. 当前行业格局\n\n  规模与阶段（2025 年）：  \n  全国房地产开发投资 82,788 亿元，同比  17.2%；施工面积 65.99 亿平方米，同比  10%\n  新建商品房销售面积 88,101 万平方米（ 8.7%）、销售额 83,937 亿元（ 12.6%），降幅较 2024 年收窄 4.2/4.5 个百分点——\"止跌回稳\"初现\n  年末商品房待售面积 76,632 万平方米（+1.6%），增幅较 2024 年末的 10.6% 大幅放缓；开发景气指数 91.45 仍处低位\n  一线城市二手房价格一度连涨多月，稳楼市政策效应逐步释放\n\n  竞争态势（三条主线）：  \n    国央企主导、民企收缩：   民营房企大量爆雷退出后，保利、华润、中海、建发等国央企占据销售榜前列，信用与融资成本成为核心竞争变量。\n    从增量开发转向存量经营：   物业、商业、租赁、城市更新的收入占比上升；代建、轻资产模式加速。\n    改善置换与房票安置：   政策端\"以旧换新\"、房票安置、收储转保障房，把需求从刚需转向改善；产品力（好房子）重新成为竞争焦点。\n\n一句话格局：  \"周期底部震荡、国央企主导、政策托底；房价止跌回稳的斜率与居民收入预期，决定行业下一步是'L型磨底'还是'温和修复'。\"  \n\n  📎 参考出处：\n    国家统计局 2025 年数据\n    中指研究院百城房价与销售月报\n\n   6. 行业壁垒\n\n    土地与资金壁垒（最高）：   拿地需要巨额资本金，融资成本决定项目利润；央企 3% 4% 与民企 8%+ 的资金成本差，本身就是无法逾越的门槛。\n    品牌与口碑壁垒：   \"保交付\"信任度决定销售去化；期房模式下，交付口碑差的房企再难获客。\n    产品与运营壁垒：   产品力（户型、园林、品质）与物业口碑在改善时代成为溢价来源；绿城、中海的产品溢价即此壁垒的体现。\n    区域与政企关系壁垒：   城市深耕、政府关系、旧改与城市更新项目的获取能力，高度依赖本地化积累。\n    规模与网络壁垒：   物业在管面积、经纪门店网络（贝壳）形成服务网络效应，存量运营越深护城河越宽。\n    资产与退出壁垒（新）：   持有型资产的运营能力+公募REITs 通道，决定资产能否\"投融管退\"闭环。\n\n  📎 参考出处：\n    房企年报毛利率与融资成本对比\n    行业研报对房企分化的分析\n\n   7. 核心监管机制\n\n  归口部门与工具：  \n    住建部  ：房地产调控、预售资金监管、保障房体系、城市更新政策\n    央行/金融监管总局  ：房贷利率与首付比例、开发贷与\"三道红线\"融资规则、保交楼专项借款\n    自然资源部  ：土地供应计划、土拍规则、闲置土地处置\n    地方政府  ：限购限贷、房票安置、人才购房补贴、价格备案\n\n  关键政策法规（近两年主线）：  \n    \"止跌回稳\"总基调（2024 年 9 月中央政治局会议提出）：   一揽子政策（降首付、降利率、\"白名单\"项目融资、取消限购）托底市场。\n    \"三道红线\"与融资协调机制：   房企去杠杆约束延续，新增\"白名单+项目制融资\"通道保证在建项目资金。\n    保交楼与交付风险化解：   专项借款、收并购、资产处置多手段并用，2024 2025 年保交楼进入攻坚收尾。\n    存量房收储与保障房：   央行保障性住房再贷款，支持收购存量商品房转为保障房，是去库存新工具。\n    预售资金监管收紧：   预售款全额监管，防止挪用导致烂尾。\n    新《住房租赁条例》方向：   租购并举，规范长租公寓与租赁市场。\n\n  准入条件提示：   房地产开发实行资质分级管理，销售需办理预售许可证；境外上市与发债受监管限制；\"三道红线\"按负债率分档约束融资。\n\n  📎 参考出处：\n    2024 2025 年中央与部委房地产政策文件\n    住建部、央行政策发布与解读\n\n   8. 行业风险\n\n    需求与价格风险（核心）：   居民收入预期、房价上涨预期一旦走弱，去化变慢、价格下行形成负反馈，是行业最主要风险。\n    债务与现金流风险：   高杠杆遗留的到期债务、销售回款不足会引发违约与爆雷（2021 2024 年民企集中风险已证明）。\n    库存与去化风险：   待售面积仍在高位（7.66 亿平方米），部分城市去化周期超 20 个月，供应结构错配。\n    政策与宏观风险：   调控方向、利率、土地供应政策变化直接影响行业节奏；经济增速放缓拖累购房力。\n    交付与舆情风险：   烂尾、质量维权、物业纠纷在情绪化传播下放大，损伤企业品牌与销售。\n    转型风险：   开发业务天花板回落，存量经营（物业、商业、租赁）盈利模式仍在验证期，转型投入可能拖累当期利润。\n\n  📎 参考出处：\n    国家统计局 2025 年待售面积与开发投资数据\n    房企风险事件公开报道\n\n   9. 近期大事件（近 6 12 个月）\n\n  时间   事件   影响  \n    "])</script><script>self.__next_f.push([1,"11:T2731,"])</script><script>self.__next_f.push([1,"快消与新消费 FMCG \u0026 New Consumer 饮料、美妆、零食：品牌与渠道的持久战 快消 新消费 食品饮料 美妆 品牌 渠道 直播电商 农夫山泉 伊利股份 海天味业 蜜雪冰城 泡泡玛特 名创优品 元气森林 \n   1. 行业一句话定义\n\n快消行业（FMCG，Fast Moving Consumer Goods）是  卖\"快速消耗、低价高频、买了就用\"的日用消费品  的行业：食品饮料、乳品、美妆个护、日化家清、烟酒都在其列；\"快消与新消费\"则叠加了  用新品牌、新渠道、新人群重做这些品类  的创业浪潮——从泡泡玛特的潮玩到蜜雪冰城的现制茶饮，本质都是\"旧品类+新表达\"。\n\n它的基本盘有多大？按需求侧看，2025 年中国社会消费品零售总额突破 50 万亿元，最终消费支出对经济增长贡献率约 52%；仅放宽到\"家用食品\"口径的消费支出约 9.05 万亿元（同比 +4.3%），非酒精饮料市场规模约 1.315 万亿元（+5.4%）、方便食品行业约 9141 亿元（+17.5%）。  这是一个以十万亿计、增长虽慢却现金流极稳的行业  ，也是观察\"消费是强是弱\"最直接的窗口。\n\n  📎 参考出处：\n    国家统计局 2025 年社会消费品零售总额数据\n    各细分行业市场规模报告（艾媒咨询、欧睿等）\n\n   2. 钱从哪来\n\n快消的\"钱\"全部来自  消费者的高频小额付费  ，按渠道与品类拆开：\n\n    C端零售收入（主盘）：   消费者在商超、便利店、线上平台、零食店、茶饮店的日常购买。2025 年中国商业零售 TOP100 企业销售额合计 39,598.1 亿元（同比 +5.7%），其中千亿级 5 家合计占比 48.9%——零售大盘仍在增长，但越来越\"集中到头部渠道\"。\n    渠道分化带来的增量：   零食集合店 2025 年规模约 1239 亿元（+19.2%）、仓储会员店约 1830 亿元（+34.6%），正在从大卖场手里抢份额；线上渠道增速（约 +7.8%）快于线下，直播电商、即时零售是主要增量来源。\n    \"一人食\"与结构性机会：   独居、小家庭、银发人群增多，\"一人食\"场景市场规模突破万亿元，速冻食品、预制菜、小包装零食吃到红利；2026H1 速冻食品在传统淡季的 C 端零售仍逆势增长。\n    新消费的资本与营销收入：   新品牌早期靠融资+营销烧出认知，成熟后靠产品毛利+复购；泡泡玛特、名创优品等还叠加 IP 授权、海外开店等收入。\n\n一句话总结：  \"快消的现金流来自'人们每天都要花的小钱'，谁能持续把'让消费者觉得值'做对，谁就能在价格战里活下来；渠道红利（零食店、会员店、即时零售）与场景红利（一人食）决定增量在哪。\"  \n\n  📎 参考出处：\n    商务部/中国商业联合会零售百强数据\n    行业研究报告（零食量贩、仓储会员店、预制菜等口径）\n\n   3. 产业链上下游\n\n以\"原料—生产—品牌—渠道—消费者\"为主线：\n\n  ① 上游（生产要素）：  \n  农产品与原料（糖、奶、大豆、油脂）、化工原料（香精香料、包装材料，属于化工与新材料行业下游）、包材（瓶、罐、袋）\n  代工厂（OEM/ODM，餐饮供应链、饮料代工）与设备商\n\n  ② 中游（品牌与生产）：  \n  品牌商：全国性大牌（农夫山泉、伊利、海天）与新消费品牌（元气森林、认养一头牛）\n  供应链与研发：口味研发、配方迭代、成本控制；蜜雪冰城式的\"自建供应链+加盟\"是极致的供应链模式\n\n  ③ 下游（渠道与消费者）：  \n  线下渠道：大卖场、商超、便利店、零食集合店、仓储会员店、夫妻店分销\n  线上渠道：货架电商（淘宝/京东）、内容电商（抖音/快手）、即时零售（美团闪购/京东到家）、社区团购\n  终端消费者：C端个人+家庭，消费决策受价格、品牌认知、颜值、情绪价值（IP、盲盒）共同影响\n\n   mermaid\nflowchart LR\n  A[上游：农产品·化工包材·OEM代工]     B[品牌商研发与生产]\n  B     C[品牌营销：广告·直播·IP联名]\n  C     D{渠道分发}\n  D     E[线下：商超/便利店/零食店/会员店]\n  D     F[线上：货架电商/直播/即时零售]\n  E     G[消费者高频复购]\n  F     G\n  G     H[复购与品牌资产]\n   \n\n  📎 参考出处：\n    行业通识结构整理\n    上市公司年报中的商业模式描述\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  农夫山泉   包装水+饮料龙头   水源地壁垒+全国网格化渠道，毛利率常年 50%+，是\"卖水生意\"的利润标杆  \n  伊利股份   乳业龙头   液态奶市占率第一，冷链+KA渠道壁垒深，百亿单品矩阵稳定  \n  海天味业   调味品龙头   酱油/蚝油全国化经销网络，品牌心智强，穿越周期的现金流生意  \n  蜜雪冰城   万店茶饮标杆   4元柠檬水背后的自建供应链+加盟体系，是\"极致性价比\"商业模式的代表作  \n  泡泡玛特   潮玩新消费代表   IP运营+盲盒情绪消费模式，海外收入高速增长，打开\"非刚需消费\"天花板  \n  名创优品   全球集合店   供应链直采+设计驱动，全球数千家门店，把\"中国制造\"卖向全球  \n  元气森林   新消费转型样本   气泡水爆品起家，2023 年后转向多品类、深耕线下渠道、控制费用  \n\n  📎 参考出处：\n    各公司 2024 2025 年报与公开资料\n    行业销售榜单\n\n   5. 当前行业格局\n\n  规模与结构（2025 2026）：  \n  社零总额突破 50 万亿元，最终消费贡献率约 52%；方便食品 9141 亿元（+17.5%，预计 2026 年破万亿）、非酒精饮料 1.315 万亿元（+5.4%）\n  \"量增价跌\"特征明显：多数品类销量增长（以部分休闲食品为例销量 +3.6%）但均价下滑（ 2.6%），消费者变得更理性、更在意性价比\n  渠道格局剧变：零食集合店（+19.2%）、仓储会员店（+34.6%）抢走大卖场份额；线上增速（+7.8%）快于线下整体\n\n  竞争态势（三条主线）：  \n    大牌与新锐的分化：   大牌靠品牌心智+渠道深度防守，新消费靠品类创新+情绪价值进攻；潮水退去后，只有跑通盈利模型的新品牌活下来（泡泡玛特、蜜雪冰城是少数赢家）。\n    渠道话语权上移：   零食硬折扣、会员店、即时零售崛起，本质是\"渠道替消费者把价格打下来\"；品牌商被迫让利，渠道型公司（万辰、鸣鸣很忙、山姆）吃到结构性红利。\n    出海成为第二曲线：   名创优品、泡泡玛特、蜜雪冰城等把中国供应链+运营能力复制海外；快消与跨境电商、新消费的边界在模糊。\n\n一句话格局：  \"总量低速、结构剧变——便宜的好货吃香，渠道型零售吃香，有IP和情绪价值的新消费吃香；没有差异化又不会控成本的白牌，会最先出局。\"  \n\n  📎 参考出处：\n    国家统计局、欧睿国际、艾媒咨询等市场规模数据\n    零售百强与渠道调研报告\n\n   6. 行业壁垒\n\n    品牌与心智壁垒（最长期）：   消费者\"不用想就买\"的习惯是核武器；海天=酱油、农夫山泉=天然水的认知一旦建立，对手砸钱也很难抢走（心智建立需数十年）。\n    渠道与分销壁垒：   全国数百万终端网点的铺货、经销商网络、冷链与物流（对接物流快递行业），是重资产、长周期的积累；新品牌最难啃的恰恰是线下。\n    规模与成本壁垒：   采购规模、产能利用率、包材集采决定单件成本；蜜雪冰城能把柠檬水卖到 4 元的前提是全球化的原料采购与自有工厂。\n    供应链与品控壁垒：   食品安全事故一票否决，稳定的原料供应（上游农业、化工）与质量体系是底线护城河。\n    产品研发与IP壁垒：   新奇口味、健康配方、IP联名（泡泡玛特的自有IP、与热门IP联名）形成的差异化，是溢价来源。\n\n  📎 参考出处：\n    上市公司毛利率与渠道网点数据\n    行业研报对品牌护城河的分析\n\n   7. 核心监管机制\n\n  归口部门与工具：  \n    市场监管总局  ：食品安全监管（《食品安全法》）、标签标识、广告宣传、价格监管\n    卫健委  ：食品标准与营养标签（新国标）、保健食品审批\n    商务部/工信部  ：消费品以旧换新、流通体系建设、消费品工业政策\n    各地市监局  ：生产许可（SC证）、流通抽查、职业打假关注点\n\n  关键政策法规（近两年主线）：  \n    食品安全监管趋严：   添加剂使用标准（如脱氢乙酸钠使用调整）、配料表\"0添加\"宣传规范化，倒逼企业重做配方与标签。\n    以旧换新与促消费政策：   2025 年国补扩围至消费品领域，家电、汽车带动明显，食品饮料更多受益于整体消费环境改善。\n    直播电商与营销合规：   《互联网广告管理办法》《网络直播营销管理办法》对虚假宣传、夸大功效严管；\"科技与狠活\"舆情多次推动配料表透明化。\n    低价竞争与内卷的引导：   行业协会与监管层多次对\"恶性价格战\"表态，鼓励品质竞争与反内卷（2025 年\"反内卷\"成为政策热词）。\n\n  准入条件提示：   食品生产需取得食品生产许可证（SC）；保健食品、婴配粉等特殊品类需注册/备案；进口食品需符合中国标准与检疫要求；跨境+出口需满足目的国合规（见跨境电商行业）。\n\n  📎 参考出处：\n    市场监管总局食品监管政策\n    2024 2025 年促消费与反内卷相关文件\n\n   8. 行业风险\n\n    需求弱恢复风险：   社零增速放缓、消费者更保守（量增价跌就是表现），高价非刚需品类（美妆、潮玩周边）最先承压。\n    价格战与内卷风险：   零食"])</script><script>self.__next_f.push([1,"12:T2665,"])</script><script>self.__next_f.push([1,"游戏与数字内容 Gaming \u0026 Digital Content 内容、社交与虚拟世界：把注意力变成收入 游戏 数字内容 短剧 动漫 腾讯游戏 米哈游 网易 腾讯游戏 网易游戏 米哈游 游戏科学 世纪华通 三七互娱 完美世界 \n   1. 行业一句话定义\n\n游戏与数字内容行业是  把\"娱乐内容\"（游戏、短剧、动漫、音视频、虚拟IP）做成可付费、可持续消费的生意  。它的核心商品是\"时间与情绪\"：玩家为游戏内物品付费、为剧情体验付费、为社交关系付费。中国已是全球第一大游戏市场：2025 年国内游戏市场实际销售收入超 3500 亿元、游戏用户约 6.8 亿已近见顶，2026H1 达 1884.5 亿元（同比 +12.17%）。\n\n\"数字内容\"是比游戏更大的盘子：短剧、动漫、直播、网文、AI生成内容都在抢同一批用户的时间。游戏是其中  付费意愿最强、商业模式最成熟  的品类——它不只是娱乐，更是新一代互联网的\"内容基建\"。\n\n  📎 参考出处：\n    伽马数据、中国音数协游戏工委年度报告\n    2026H1 中国游戏产业报告\n\n   2. 钱从哪来\n\n游戏的\"钱\"从玩家付费与广告中来，按商业模式拆开：\n\n    内购/虚拟道具（最核心）：   F2P（免费+内购）模式主导，玩家免费进入、为皮肤、抽卡、通行证付费。2026Q1 腾讯游戏收入 421 亿元（+3.1%）、网易 198 亿元（+2.8%），头部产品流水稳定。\n    买断制（单机/主机）：   一次性付费购买游戏。2025 年国产买断制单机市场规模 31.6 亿元（+17%），《黑神话：悟空》累计销量超 3000 万份（数据为截至 2025 年公开披露口径），中国主机游戏市场 83.62 亿元（+86.33%）——低基数高增长。\n    付费订阅与会员：   Xbox Game Pass、PlayStation Plus 等订阅制分流部分用户时长；短剧行业用\"切片付费\"和平台分账。\n    广告与IP授权：   休闲游戏广告变现；IP 联名（游戏IP授权到快消、潮玩）打开第二曲线。\n    出海收入（重要增量）：   2026 年 8 月中国自研游戏海外实际销售收入 20.30 亿美元（同比 +20.87%），东南亚、中东、拉美是新增长极。\n\n一句话总结：  \"游戏本质是'内容+运营'的长期生意——把玩家留下来、让玩家为情绪价值付费；内购靠长线运营，买断制靠产品力，出海靠本地化，版号是行业最大的'供给阀门'。\"  \n\n  📎 参考出处：\n    伽马数据月度/半年度报告\n    腾讯、网易等公司财报与公开披露\n\n   3. 产业链上下游\n\n以\"研发—发行—渠道—玩家\"为主线：\n\n  ① 上游（生产要素）：  \n  游戏引擎（Unity、虚幻）、美术外包/中台、音乐音效、AI 辅助生产（AIGC 生成素材）\n  数值/玩法策划、程序、美术三大工种的创意团队\n  半导体与电子技术底座（手机/PC/主机的硬件性能）→ 上游关联\"半导体与电子\"\n\n  ② 中游（研发与发行）：  \n  研发商（自研 vs 代理）、发行商（买量、渠道运营、本地化）、平台方（iOS/安卓商店、Steam/主机商店）\n  电竞（赛事组织、俱乐部）、游戏直播/视频（B站、抖音）\n\n  ③ 下游（玩家与内容消费者）：  \n  玩家（手游用户 6.8 亿、端游主机用户、Steam 买断用户）\n  IP 消费端：动漫、电影、潮玩、线下乐园（游戏IP跨到快消与新消费行业下游）\n  广告主（休闲游戏广告为主）\n\n   mermaid\nflowchart LR\n  A[上游：引擎·美术外包·AI工具·硬件]     B[研发：策划/程序/美术/数值]\n  B     C[发行：买量·渠道·本地化·运营]\n  C     D[平台：应用商店·Steam·主机商城]\n  D     E[玩家付费：内购/买断/订阅/广告]\n  E     F[长线运营与IP衍生]\n  F     G[复购·口碑·IP联名]\n   \n\n  📎 参考出处：\n    行业通识结构整理\n    伽马数据产业链报告\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  腾讯游戏   全球收入第一   长青产品《王者荣耀》《和平精英》+投资并购+海外工作室，现金流极其稳定  \n  网易游戏   自研头部厂商   《蛋仔派对》《逆水寒》多品类突破，IP长线运营与端转手能力强  \n  米哈游   二次元内容标杆   《原神》全球收入惊人，高投入+全球化发行，是\"内容驱动\"模式代表  \n  游戏科学   国产3A破局者   《黑神话：悟空》3000万份销量验证国产买断制市场，提振行业信心  \n  三七互娱   发行买量模式   页游转手游发行的效率玩家，小游戏与出海是当前增量  \n  世纪华通   老牌+AI探索   传奇系IP+盛趣整合，布局AI游戏研发与数据中心  \n  完美世界   研发驱动   端游/主机转手游代表，全球化多品类产品线  \n\n  📎 参考出处：\n    各公司 2025 年财报与公开资料\n    伽马数据头部厂商排名\n\n   5. 当前行业格局\n\n  规模与阶段（2025 2026）：  \n  2025 年中国游戏市场收入超 3500 亿元，用户约 6.8 亿见顶（增量靠ARPU与出海，不再靠人口红利）\n  2026H1 收入 1884.5 亿元（+12.17%），景气回升；2026 年 8 月国内游戏市场 316.27 亿元（+8.08%）\n  2025 年发放版号 1771 个，创七年新高（2025 年 9 月单月 209 个），版号供给常态化\n\n  竞争态势（三条主线）：  \n    头部集中、长青产品主导：   腾讯、网易、米哈游三家拿走市场大部分流水；《王者荣耀》《原神》等上线多年的长青产品流水依然靠前，游戏从\"爆款赌场\"转向\"长线运营\"。\n    买断制与3A新机会：   《黑神话：悟空》之后，国产单机/主机迎来内容红利窗口；但研发周期长、投入大，仍是少数人的游戏。\n    出海与本地化竞争：   版号宽松+国内市场见顶，出海成为必选项；东南亚、中东、拉美增速快，但每个市场都要做本地化（语言、题材、支付、合规）。\n\n一句话格局：  \"国内市场重回增长但靠'存量玩家多花钱+版号供给放宽'，头部厂商吃长线运营红利，新机会在买断制3A与出海本地化；行业从拼流量转向拼内容与全球化能力。\"  \n\n  📎 参考出处：\n    伽马数据、中国音数协游戏工委数据\n    上市公司财报\n\n   6. 行业壁垒\n\n    研发与人才壁垒（最高）：   3A/高质量产品需要顶尖策划、程序、美术团队与多年积累；《黑神话》耗时多年、投入数亿，多数团队难以复制。\n    IP与用户资产壁垒：   长青产品的用户基数是\"会持续付费的资产\"；《王者荣耀》《蛋仔派对》的用户量与社交关系链构成强网络效应。\n    版号与合规壁垒：   版号审批是行业最大的准入门槛，拿不到版号就没有国内商业化的\"入场券\"；未成年人防沉迷、充值限额等合规要求抬高门槛。\n    发行与获客壁垒：   买量成本（单用户价格）持续上升，发行商的投放效率、数据能力和渠道关系决定ROI天差地别。\n    技术壁垒（AI时代）：   AI 生成内容（AIGC）正在重塑美术、剧本、测试环节，能否把AI用在降本增效的刀刃上，会成为大量中小团队的分水岭。\n\n  📎 参考出处：\n    行业研报对研发壁垒的分析\n    伽马数据买量成本与版号数据\n\n   7. 核心监管机制\n\n  归口部门与工具：  \n    国家新闻出版署  ：版号审批（游戏上线前置条件）、内容审核\n    中宣部/网信办  ：内容导向、未成年人保护\n    文旅部  ：网络表演（电竞、游戏直播）与网络文化经营许可（文网文）\n    工信部/市场监管总局  ：App合规、充值消费规范\n\n  关键政策法规（近两年主线）：  \n    版号常态化：   2025 年发放 1771 个（七年新高），审批从\"寒冬\"走向\"常态化供给\"，行业预期稳定。\n    未成年人防沉迷（延续）：   实名认证+时长/消费限额，2021 年\"830新规\"后持续收紧，对游戏收入结构造成长期影响。\n    内容审核与合规：   游戏内容不能涉历史虚无、血腥暴力、赌博机制（部分玩法需规避\"开箱赌博\"争议）；短剧需备案（微短剧备案制全面实施）。\n    AI生成内容治理：   《生成式人工智能服务管理暂行办法》要求 AI 生成内容可追溯、不侵害权益，AIGC 素材用于商业游戏需版权合规。\n    少子化与青少年保护：   对大额充值、诱导消费的投诉治理趋严，防沉迷技术（人脸识别、宵禁）落地。\n\n  准入条件提示：   国内上线游戏须先取得版号；运营需《网络文化经营许可证》（文网文、现已并入网络文化经营许可）；海外发行需遵守目标国合规（年龄分级、数据合规GDPR、支付监管等）。\n\n  📎 参考出处：\n    国家新闻出版署版号发放公告\n    未成年人保护与内容审核相关法规\n\n   8. 行业风险\n\n    政策与版号风险（历史最大变量）：   版号审批放缓或收紧会直接掐断产品线；未成年人保护政策曾单季冲击头部公司收入。\n    产品生命周期风险：   游戏是\"内容产品\"，爆款不可预测；流水靠新品接力，一旦长青产品老化、新品不及预期，收入断崖。\n    买量成本上升风险：   流量红利消退，CPI（单用户获取成本）上升吞噬利润，买量型公司毛利承压。\n    海外市场风险：   出海要面对地缘政治、汇率、本地合规（数据、支付、年龄分级）、盗版与封禁（如印度曾封禁中国App）。\n    人才与创意风险：   核心制作人/团队出走、创意枯竭；"])</script><script>self.__next_f.push([1,"13:T273f,"])</script><script>self.__next_f.push([1,"低空经济 Low-altitude Economy 无人机与 eVTOL：争夺城市上空的第三维度 低空经济 无人机 eVTOL 通用航空 空域 大疆 大疆创新 亿航智能 小鹏汇天 沃兰特 峰飞航空 极飞科技 中国通号/民航局体系 \n   1. 行业一句话定义\n\n低空经济是  以 1000 米以下（可延伸至 3000 米）的\"低空空域\"为主要活动空间，用无人机、eVTOL（电动垂直起降飞行器）、直升机等航空器承载载人运输、物流配送、农业植保、巡检测绘、应急救援等任务的产业生态  。它是\"飞行+行业\"的交叉生意，既包括造飞机的整机厂，也包括空域管理、起降点、通信导航等基础设施，以及各行业的飞行服务应用。\n\n规模有多大？2025 年中国低空经济市场规模约 1.5 万亿元，行业预期到 2035 年达 3.5 万亿元；无人机相关企业超 8.9 万家，2025 年无人机出口额 223.2 亿元，中国已成为世界第一大民用无人机出口国。  这是政策点名\"新增长引擎\"、增速快但仍在商业化爬坡期的行业  ：一边是国家战略级的想象空间，一边是整机厂\"订单多、确认少、亏损大\"的现实。\n\n  📎 参考出处：\n    中国民航局、发改委低空经济发展相关文件与数据\n    赛迪研究院等低空经济产业报告\n\n   2. 钱从哪来\n\n低空经济的\"钱\"来自政府投入、企业订单与消费者付费三个渠道：\n\n    政府端（基建与场景采购，当前占比最高）：   低空空域管理改革、起降点/通航机场建设、城市低空飞行测试场、政府采购（消防、应急、测绘、公安巡查）是早期的主要资金来源；地方财政与专项债支持是行业起步的\"第一桶金\"。\n    整机销售与运营：   无人机整机销售（大疆消费级+行业级）、eVTOL订单（2025 年 eVTOL 年度订单金额超 300 亿元，但多数为\"意向订单\"）、通用航空器租赁与飞行服务。\n    行业应用服务费：   农业植保（按亩收费）、物流配送（快递公司采购飞行服务，对接物流快递行业）、电力/油气巡检、测绘、应急救援等服务型收入——这是最接近\"可持续现金流\"的部分。\n    资本市场：   一级市场融资（亿航、沃兰特、时的科技等获多轮融资）与二级市场主题投资，是整机研发高投入期的关键资金来源。\n\n一句话总结：  \"低空经济现阶段'政府买单、资本输血、行业付服务费'三足鼎立——基础设施和试点场景靠财政，整机研发靠融资，真正能自负盈亏的只有应用服务（植保、巡检、物流）和小型无人机整机。\"  \n\n  📎 参考出处：\n    民航局低空经济专题数据\n    eVTOL 企业融资与订单公开信息\n\n   3. 产业链上下游\n\n以\"飞行器制造—基础设施—运营服务\"为主线：\n\n  ① 上游（生产要素）：  \n  航空级材料（碳纤维、复合材料，属化工与新材料关联）、动力电池与电机（对接新能源）、芯片与传感器（对接半导体与电子——上游关联）\n  飞控系统、导航定位（北斗/GPS）、通信链路（5G A通感一体）\n\n  ② 中游（整机与基建）：  \n  整机制造：消费级/行业级无人机（大疆、极飞）、eVTOL（亿航、沃兰特、峰飞、小鹏汇天）、直升机、固定翼通航飞机\n  低空基础设施：低空空管系统、通信导航监视（CNS）、起降点/飞行服务站、数字化低空平台、气象服务\n\n  ③ 下游（应用与用户）：  \n  物流配送（顺丰丰翼、美团无人机）、农业植保、电力/油气巡检、测绘地理信息、应急救援、城市治理（无人机巡查）\n  载人交通（eVTOL 城市空中交通试点）、低空旅游（通航+观光）\n  政府（应急、消防、公安）、企业（电力、石油、农业大户）、个人（航拍消费者）\n\n   mermaid\nflowchart LR\n  A[上游：材料·电池·芯片·飞控·通信]     B[整机制造：无人机/eVTOL/通航飞机]\n  B     C[低空基础设施：空管·起降点·通信导航]\n  C     D{运营与应用}\n  D     E[物流配送]\n  D     F[农业植保与巡检]\n  D     G[应急救援与城市治理]\n  D     H[载人交通与旅游]\n  E     I[商业闭环：服务费/订单/政府采购]\n   \n\n  📎 参考出处：\n    赛迪研究院低空经济产业链图谱\n    民航局低空飞行服务保障体系建设方案\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  大疆创新   全球民用无人机绝对龙头   消费级+行业级双霸主，占中国无人机出口绝对主力，技术+供应链成本双重壁垒  \n  亿航智能   eVTOL载人第一证   全球首张无人驾驶载人航空器TC（型号合格证），广州政务航线商业化试点  \n  小鹏汇天   飞行汽车代表   背靠小鹏汽车，分体式飞行汽车兼顾地面行驶与飞行，面向个人出行  \n  沃兰特   eVTOL客运新锐   客运级eVTOL产品线，意向订单 1900 架，但确认订单仅 14 架（商业化阵痛样本）  \n  峰飞航空   大型货运eVTOL   大型货运无人机跨海/高原场景验证，货运先行的务实路线  \n  极飞科技   农业无人机龙头   植保无人机全球领先，服务型商业模式（按亩收费）较为健康  \n  顺丰丰翼/美团无人机   物流无人机先行者   城市即时配送+偏远地区物流场景落地，低空物流商业化的排头兵  \n\n  📎 参考出处：\n    各公司公开资料与融资信息\n    民航局适航审定公告\n\n   5. 当前行业格局\n\n  规模与阶段（2025 2026）：  \n  2025 年低空经济市场规模约 1.5 万亿元，2035 年目标 3.5 万亿元；无人机相关企业超 8.9 万家（含大量配套与小型整机）\n  2025 年无人机出口额 223.2 亿元，世界第一民用无人机出口国；2026H1 全国无人机飞行 2641.4 万小时（同比 +8%）\n  eVTOL 商业化仍处早期：2025 年年度订单金额超 300 亿，多为意向订单；亿航 2025Q2 营收 7790 万元（同比  31.3%）、沃兰特意向订单 1900 架但确认仅 14 架\n\n  竞争态势（三条主线）：  \n    大疆一家独大，应用端百花齐放：   整机领域大疆技术+成本碾压，其他厂商在行业应用（农业、物流、巡检）找差异化；eVTOL 载人赛道是全新的多条线并跑（亿航、沃兰特、峰飞、小鹏汇天、时的科技等）。\n    整机融资热、商业化冷：   eVTOL 企业融资和意向订单很多，但适航取证慢、运营盈利远未验证，\"PPT承诺\"与\"确认收入\"差距大，行业进入洗牌前夜。\n    地方政府竞相布局：   深圳、合肥、成都、苏州等城市争建低空经济示范区，基建（起降点、空管平台）与场景（政务巡逻、物流试点）先行，产业聚集效应明显。\n\n一句话格局：  \"政策+资本把赛道捧热，但行业真实收入仍集中在'无人机整机+行业应用服务'；载人eVTOL是'明天的生意'，谁能先在适航、运营、盈利三个层面跑通，谁才能留在牌桌上。\"  \n\n  📎 参考出处：\n    赛迪研究院、民航局低空经济数据\n    亿航、沃兰特等公司披露\n\n   6. 行业壁垒\n\n    适航审定壁垒（eVTOL最高）：   载人航空器需取得型号合格证（TC）、生产许可证（PC）、适航证（AC），审定周期长（数年）、标准严苛，是后来者最难跨越的门槛。\n    技术与供应链壁垒：   飞控算法、动力系统（电机/电池）、航空级材料、高可靠性设计——航空航天级品控与消费级成本之间需要极致平衡，大疆的垂直整合能力是其护城河。\n    空域与牌照壁垒：   飞行需要空域审批、运营资质（通用航空经营许可），政策牌照与地方试点资格本身是稀缺资源。\n    数据与场景壁垒：   低空物流、巡检、农业等应用需要长期场景积累（航线网络、作业数据、客户信任），先发者粘性极强。\n    资金与规模壁垒：   整机研发动辄数十亿投入、多年无法盈利，只有融资能力强或背靠大集团（小鹏、顺丰）的玩家能撑到商业化。\n\n  📎 参考出处：\n    民航局适航审定规章（CCAR 21 等）\n    行业对低空经济壁垒的分析报告\n\n   7. 核心监管机制\n\n  归口部门与工具：  \n    中国民航局（CAAC）  ：适航审定（TC/PC/AC）、运行规章、无人机实名登记与运行管理\n    中央空管委/军方（空域管理）  ：空域划分与飞行计划审批——低空空域是\"军民共管\"的特殊资源\n    工信部/发改委  ：低空产业政策、无人机制造标准、《低空经济及其核心产业统计分类(试行)》\n    公安部/地方政府  ：低空安全（反制黑飞）、地方试点与产业园政策\n\n  关键政策法规（近两年主线）：  \n    实名登记+运行识别强制化：   2025 05 01 起无人机实名登记与运行识别强制国标实施；2025 11 01 起所有民用无人驾驶航空器须加装运行识别模块——\"黑飞\"治理是行业健康化的前提。\n    统计口径确立：   2025 12 26 发改委印发《低空经济及其核心产业统计分类(试行)》，解决\"低空经济到底算多大\"的口径问题。\n    《民用航空法》修订（2026 07 01 施行）：   新民航法增设\"发展促进\"专章，首次在法律层面为低空经济划出发展空间与监管框架。\n    L3级别eVTOL试运行/运行标准：   民航局推动载人级无人驾驶航空器运营试点（亿航在广州、合肥等城市开展政务航线/观光商业化载人运营），适航与运行标准并行推进。\n\n  准入条件提示：   无人机需实名登记（UOM系统）+运行识别；商业运营需通用航空经营许可或相关试点资质；eVTOL载人需型号合格证+运营许可；空域使用需提前报批。\n\n  📎 参考出处：\n    民航局《民用无人驾"])</script><script>self.__next_f.push([1,"14:T25a9,"])</script><script>self.__next_f.push([1,"跨境电商 Cross-border E-commerce 把中国商品卖到全世界：物流、平台与合规 跨境电商 出海 亚马逊 TikTok电商 shein temu 独立站 安克创新 SHEIN TEMU（拼多多旗下） TikTok Shop 子不语 致欧科技 有棵树/赛维时代 \n   1. 行业一句话定义\n\n跨境电商是  把中国制造的商品，通过海外电商平台、独立站或社交媒体，直接卖给海外消费者的生意  。它与传统外贸的本质区别是\"渠道下沉\"：外贸做 B2B 大单、跨境电商做 B2C 零售（也有 B2B 线上化），中国工厂/卖家第一次拥有了直接触达全球消费者的能力。\n\n规模有多大？2025 年中国跨境电商进出口 2.75 万亿元，较 2020 年增长 69.7%（复合增速高，但同比增速已降至 4.8%）；其中出口 2.27 万亿元，约占货物贸易出口的 8.4%。  这是一个从\"野蛮增长\"走向\"存量深耕+合规化\"的成熟期行业  ：红利不再是\"只要上架就能卖\"，而是\"供应链、品牌、流量、合规\"的综合能力竞争。\n\n  📎 参考出处：\n    海关总署跨境电商进出口数据\n    商务部跨境电商综合试验区与行业报告\n\n   2. 钱从哪来\n\n跨境电商的\"钱\"来自海外消费者的最终购买，按模式拆开：\n\n    平台卖家模式（最普遍）：   在亚马逊、TikTok Shop、Shopee、eBay 等平台开店，靠选品+运营+广告获取订单。亚马逊 2025 年全球新增卖家 16.5 万（同比  44%，为 2015 年以来最低）——平台新进入者在减少，说明\"开店红利\"消退。\n    独立站/DTC模式（品牌化）：   自建网站（Shopify等），掌握用户数据与复购，但获客成本高；安克创新（Anker）是产品驱动独立站+亚马逊双轨的标杆。\n    全托管/半托管模式（平台重仓）：   TEMU、SHEIN、TikTok Shop 等把\"选品、履约、运营\"全部/部分接管，卖家只供货——卷的是\"极致供应链+极致低价\"。\n    服务型收入：   广告（平台广告、谷歌/Facebook投流）、物流（海外仓/专线，对接物流快递行业）、支付（跨境结算、外汇服务）、SaaS（选品/ERP软件）等卖水人也在分走利润。\n\n一句话总结：  \"跨境电商的钱最终来自'中国供应链差价+海外流量'，卖货的分化出平台卖家、独立站、全托管三条路；能赚大钱的是'有品牌溢价+能控流量成本+供应链够硬'的公司，而平台与物流永远是旱涝保收的卖水人。\"  \n\n  📎 参考出处：\n    海关总署数据\n    亚马逊卖家生态报告、Marketplace Pulse 等第三方统计\n\n   3. 产业链上下游\n\n以\"工厂—卖家/品牌—平台/独立站—物流—海外消费者\"为主线：\n\n  ① 上游（供给侧）：  \n  中国制造工厂（快消与新消费、消费电子等行业上游供货）\n  供应链服务商（选品、质检、代工、柔性供应——SHEIN 的柔性供应链是极致样本）\n\n  ② 中游（卖家与平台）：  \n  卖家：铺货型大卖（多SKU多平台）、精品/品牌型卖家（Anker、致欧）、工厂型卖家（制造转跨境）\n  平台：亚马逊、TEMU、SHEIN、TikTok Shop、速卖通、Shopee、独立站基建（Shopify）\n\n  ③ 下游（履约与消费者）：  \n  物流：国际小包/专线、海外仓（头程+尾程）、本地配送（对接物流快递行业）\n  支付与金融：跨境收款（Payoneer、连连）、外汇兑换、退换货保险（对接金融）\n  海外消费者：欧美（存量高客单）、东南亚（57% 占比成第一增长极）、中东/拉美（新兴）\n\n   mermaid\nflowchart LR\n  A[上游：中国工厂·供应链服务]     B{卖家模式}\n  B     C[平台卖家：亚马逊/TikTok/Shopee]\n  B     D[独立站/DTC]\n  B     E[全托管：TEMU/SHEIN供货]\n  C     F[海外消费者]\n  D     F\n  E     F\n  F     G[复购与品牌资产]\n  G     H[供应链迭代与本地化深耕]\n   \n\n  📎 参考出处：\n    行业通识结构整理\n    跨境电商企业年报与平台公开数据\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  安克创新   品牌出海标杆   Anker 充电/储能/智能硬件全球化，研发+品牌双驱动，毛利率行业领先  \n  SHEIN   快时尚跨境巨头   柔性供应链+小单快反+极致低价，全球快时尚市场份额直追 ZARA  \n  TEMU   全托管模式代表   拼多多旗下，2022 年上线后席卷欧美东南亚，用\"极致低价+全托管\"重构跨境供给  \n  TikTok Shop   直播/内容电商出海   把国内直播电商复制到海外，东南亚先发、美区放量，是最大的增量渠道  \n  子不语   中腰部卖家样本   服装跨境，亚马逊+独立站双渠道，代表铺货型企业的上市路径与波动  \n  赛维时代   大卖型上市公司   多品类多平台铺货+品牌孵化，是深圳大卖模式的代表  \n  致欧科技   家居品类品牌化   深耕亚马逊+欧美家居市场，注重产品设计与本地化，品牌溢价高于铺货型  \n\n  📎 参考出处：\n    各公司年报与公开资料\n    App Annie / Sensor Tower 等榜单数据\n\n   5. 当前行业格局\n\n  规模与阶段（2025 2026）：  \n  2025 年跨境电商进出口 2.75 万亿元（较 2020 +69.7%、同比增速降至 4.8%），出口 2.27 万亿元占货物贸易出口 8.4%\n  自主品牌产品出口同比 +12.9%、占出口比重提升 1.4 个百分点——\"从卖货到卖品牌\"的结构升级在发生\n  亚马逊 2025 年全球新增卖家 16.5 万（ 44%），开店红利消退；A 股上市公司境外收入合计 12.38 万亿元（+13.3%）\n\n  竞争态势（三条主线）：  \n    全托管与半托管的冲击：   TEMU、SHEIN、TikTok Shop 以\"平台管运营、卖家只供低价货\"快速起量，把价格打到地板的同时，也把中小卖家的利润和话语权压到最低；传统亚马逊卖家被迫转向精品化、品牌化。\n    从\"铺货\"到\"品牌\"：   平台流量贵、合规严、价格战凶，能活下来的卖家越来越靠产品差异化和品牌复购（安克、致欧、Shein 已品牌化），铺货型大卖（有棵树等）经历大起大落后转型。\n    新增量在内容电商与新兴市场：   TikTok Shop 的内容/直播带货是最大增量渠道；东南亚以 57% 占比成为未来三年出海第一增长极，中东、拉美紧随其后。\n\n一句话格局：  \"'低价出海'红海化、'品牌出海'正当时：全托管把供应链价格战打到极致，平台卖家向精品与品牌升级，增量来自内容电商和东南亚等新兴市场；合规和利润比扩张速度更重要。\"  \n\n  📎 参考出处：\n    海关总署跨境电商数据\n    第三方跨境行业报告（亿邦动力、雨果跨境等）\n\n   6. 行业壁垒\n\n    供应链壁垒（最核心）：   极致的成本与柔性能力（SHEIN 小单快反、TEMU 全托管压价、安克研发驱动的品质）——中国制造的优势要落到\"反应速度与成本控制\"才能变成壁垒。\n    流量与品牌壁垒：   独立站/DTC 的品牌认知与复购、亚马逊评论与排名资产、TikTok 内容资产——存量流量资产是拿真金白银和时间堆出来的。\n    海外仓与履约网络壁垒：   海外仓布局、本地退货处理、头程尾程成本控制（对接物流快递行业），重资产、前期投入大，但决定时效与用户体验。\n    合规与本地化壁垒：   税务（VAT/关税）、产品认证（欧美CE/FCC、食药认证）、数据合规（GDPR）、平台规则（封号风险）——合规做不好直接出局，本地化（语言、文化、支付）决定转化率。\n    资金与规模壁垒：   备货资金、广告预算、账期与汇率风险，头部卖家的资金池让小卖家难以正面竞争。\n\n  📎 参考出处：\n    跨境电商上市公司财报与商业模式\n    行业对供应链与合规壁垒的分析\n\n   7. 核心监管机制\n\n  归口部门与工具：  \n    商务部  ：跨境电商综试区政策、对外贸易促进\n    海关总署  ：跨境电商零售进出口监管（9610/9710/9810等监管代码）、税收政策\n    税务总局  ：出口退税、2025年平台涉税信息报送（平台经济税收监管收紧）\n    市场监管总局/工信部  ：产品质量、认证、数据与网络监管\n    目的国监管（重点）：   欧盟 VIES/VAT、美国关税与301条款、欧盟GPSR（商品安全法规）、各国平台税务报送\n\n  关键政策法规（近两年主线）：  \n    出口合规体系化：   2025 年起平台涉税信息报送全面实施，刷单、低报货值、偷逃税空间被压缩；85% 企业将监管合规列为出海首要风险。\n    目的国贸易政策冲击：   美欧对中国商品关税、T86小包免税政策调整（美国曾取消800美元以下小包免税，虽一度暂停）、欧盟加强对中国平台（TEMU/SHEIN）的商品安全审查——贸易环境是最大外部变量。\n    平台规则升级：   亚马逊等平台强化账号验证、品牌备案、广告合规；TEMU 等平台加强对供应商资质审核与质检。\n    跨境电商综试区扩容与便利化：   商务部持续扩容综试区，简化通关、退税与外汇结算流程，支持海外仓建设。\n\n  准入条件提示：   出口需做出口报关（跨境电商监管代码）；零售出口可享增值税无票免税或出口退税政策；进口（跨境保税进口1210）需三单对碰（订单/支付/物流）；海外经营需注册目的国公司/税号、取得产品认证。\n\n  📎 参考出处：\n "])</script><script>self.__next_f.push([1,"15:T28d7,"])</script><script>self.__next_f.push([1,"化工与新材料 Chemical \u0026 New Materials 所有工业的“粮仓”：材料决定产业天花板 化工 新材料 锂电材料 半导体材料 万华化学 巴斯夫 万华化学 巴斯夫 中石化/中石油 华鲁恒升 多氟多 万润/当升等锂电材料企业 雅克科技/彤程新材 恩捷股份 \n   1. 行业一句话定义\n\n化工与新材料行业是  把石油、煤炭、天然气、矿产等基础资源加工成化学品与材料，为所有下游工业提供\"粮仓\"的基础行业  。通俗说：大宗化工造\"量大价低\"的基础品（塑料、化肥、纯碱、MDI），新材料造\"量小价高\"的高端品（半导体材料、高性能聚合物、锂电材料）。没有化工，汽车、手机、医药、新能源全都造不出来——它是所有制造业的上游基础设施。\n\n  📎 参考出处：\n    中国石油和化学工业联合会年度行业运行报告\n    《\"十四五\"原材料工业发展规划》等官方文件\n\n   2. 钱从哪来\n\n化工与新材料行业的\"钱\"分几层：\n\n    大宗化工品：赚\"周期价差\"与\"成本差\"。   产品同质化、价格随供需周期波动；企业靠\"低原料成本+大规模+高效率\"在周期底部盈利，靠\"价差扩大\"在周期顶部暴利。华鲁恒升、万华化学都是\"成本控\"的典型。\n    新材料：赚\"技术溢价\"与\"国产替代空间\"。   高端材料（光刻胶、电子特气、高性能膜、特种工程塑料）全球市场多被外资垄断，国产替代=把高毛利产品从\"进口价\"降到\"国产价\"，这是最大的结构性增量。半导体材料国产替代空间超千亿元。\n    一体化与集群的钱：   化工园区化、炼化一体化让\"上一环节的副产物=下一环节的原料\"，大幅降低物流与能耗成本（万华化学\"原料 中间体 成品\"全产业链闭环是最佳样本）。\n    政策与新能源红利：   锂电材料（磷酸铁锂、隔膜、电解液）、光伏材料（EVA/POE胶膜）、风电材料（碳纤维）随新能源放量，是过去三年化工行业最大的增量需求来源。\n\n一句话总结：  大宗化工赚\"周期+成本\"，新材料赚\"技术+替代\"，一体化赚\"协同\"，新能源材料赚\"景气\"。   谁在买单？最终是所有制造业（汽车、电子、医药、家电、基建）的成本项。\n\n  📎 参考出处：\n    万华化学、华鲁恒升等上市公司年报与公告\n    光大证券等机构基础化工行业研报（2026）\n\n   3. 产业链上下游\n\n以\"资源→基础化工→新材料→终端制造\"为主线：\n\n  ① 上游（资源与基础原料）：  \n  石油/天然气/煤炭 → 炼化（中石化、中石油、恒力、荣盛）→ 基础化工原料（烯烃、芳烃、甲醇、合成氨）\n  矿石矿产（磷、锂、氟、钛、稀土）→ 精细化工中间体\n\n  ② 中游（化工品制造）：  \n  大宗：MDI/TDI（万华化学）、纯碱、烧碱、PVC、化肥（磷肥/氮肥）、煤化工（华鲁恒升、宝丰能源）\n  氟化工（多氟多、巨化股份）：从制冷剂到含氟聚合物、含氟锂电材料\n  新材料平台（万华化学、金发科技）：聚氨酯、工程塑料、特种材料\n\n  ③ 新材料的垂直链（量小价高）：  \n  锂电材料：正极（磷酸铁锂/三元）→负极→隔膜（恩捷股份）→电解液（天赐材料、新宙邦）→电池\n  半导体材料：光刻胶（彤程新材、雅克科技）→电子特气（华特气体、金宏气体）→湿电子化学品→CMP 抛光与硅片\n  高性能材料：碳纤维（中复神鹰、光威复材）→复合材料→风电叶片/航空/机器人\n\n  ④ 下游（终端制造）：  \n  新能源（电池/光伏）、半导体与电子、汽车、医药、家电、建筑地产、农业、纺织\n\n   mermaid\nflowchart LR\n  A[资源：油·气·煤·矿]     B[基础化工：炼化·大宗品]\n  B     C[新材料：锂电/半导体/高性能材料]\n  C     D[下游：新能源/电子/汽车/医药等]\n  B     E[农化/日化/建材等]\n   \n\n  📎 参考出处：\n    各环节代表公司公开公告与年报\n    中国石油和化学工业联合会产业链数据\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  万华化学   MDI 全球市占率超 30% 的聚氨酯龙头   2025 2026 年跨界锂电材料（磷酸铁锂）、半导体材料、生物制造；海外收入占比超 50%  \n  巴斯夫   全球最大化工企业   湛江一体化基地，全球化与一体化样本  \n  中石化/中石油   炼化一体化国家队   大宗化工品供应主力，向新材料转型  \n  华鲁恒升   煤化工平台型龙头   多联产平台，成本护城河的标杆  \n  多氟多   氟化工+锂电材料龙头   六氟磷酸锂全球龙头，2025 年新能源材料业务是第一大营收板块  \n  恩捷股份   锂电隔膜全球龙头   隔膜\"一超多强\"格局代表，绑定电池厂  \n  雅克科技/彤程新材   半导体材料国产替代代表   光刻胶、电子特气等卡脖子环节突破样本  \n  中复神鹰   碳纤维国产龙头   高性能碳纤维放量，受益风电/航空/机器人  \n\n  📎 参考出处：\n    各公司 2025 年年报/公告\n    新浪财经、市场资讯对万华化学跨界布局的跟进报道（2025 12 等）\n\n   5. 当前行业格局\n\n  规模与结构：  \n  中国是全球最大化工市场，主要大宗化工品产能与消费量全球第一\n  行业整体进入\"产能过剩、盈利分化\"阶段：传统大宗品价格低位、多数企业亏损或微利；新材料与部分子行业（氟化工、锂电材料、半导体材料）结构性景气\n  2026 年上半年基础化工板块业绩改善明显：30 余家公司净利润同比翻倍，石化/化工板块受需求复苏与涨价拉动（光大证券 2026 07 行业报告）\n\n  竞争态势：  \n    大宗品：\"剩者为王\"。   产能过剩下拼成本、拼一体化、拼能耗指标；落后产能通过\"能耗双控+安全环保\"出清，头部企业与平台型企业（万华、华鲁恒升）市场份额与盈利韧性持续提升\n    新材料：国产替代进行时。   半导体材料、高端聚合物认证周期长（半导体级材料认证以年计），一旦突破即获得稳定高毛利；国产替代率低=想象空间大\n    跨界融合加剧：   传统化工巨头（万华化学）向锂电、半导体、生物制造延伸；电池、光伏巨头反向布局上游材料（宁德时代锁定磷矿、氟化工一体化）\n    全球化布局：   龙头企业海外产能与收入占比提升，同时面临欧美贸易壁垒与环保监管升级\n\n一句话格局：  \"大宗品拼成本生存，新材料拼替代增量；行业整体从'扩张期'进入'分化期'。\"  \n\n  📎 参考出处：\n    光大证券《基础化工行业周报：26H1 业绩表现亮眼》（2026 07 12）\n    新浪财经《基础化工密集预喜，30 余家公司上半年净利润翻倍》（2026 07 21）\n\n   6. 行业壁垒\n\n    资金与规模壁垒（极高）：   化工是典型重资产：一条新材料产线动辄数亿至数十亿，一体化基地投资百亿级；规模决定单位成本，小玩家无法与龙头拼成本。\n    技术壁垒（新材料最硬）：   高端材料配方+工艺+know how 密集，研发周期以十年计；半导体材料等对纯度（电子级）与一致性要求苛刻，认证周期长、技术门槛陡峭。\n    安全环保壁垒：   化工生产受危化品安全、环保排放强监管；新建项目需\"能评+环评+安评\"审批，园区准入稀缺，\"邻避效应\"让新产能落地极难，存量产能因此更值钱。\n    客户认证壁垒：   材料进入下游供应链需长期验证（电池厂认证以年计、晶圆厂认证更久），一旦进入供应商名单，切换成本高、黏性强。\n    原料与稀缺资源壁垒：   磷、锂、氟、稀土等上游资源布局决定成本线（万华参股磷矿、多氟多锁定氟资源），有矿者得天下。\n\n  📎 参考出处：\n    化工项目审批与安全环保监管政策（应急管理部、生态环境部）\n    行业研报对材料认证周期、资本开支强度的分析\n\n   7. 核心监管机制\n\n  归口部门（多头监管）：  \n    工业和信息化部  ：石化化工行业运行、绿色制造标准、新材料产业政策\n    国家发展改革委  ：重大项目核准/备案、能耗双控与节能审查\n    生态环境部  ：环评、排污许可、碳市场（化工纳入碳交易范围扩大）\n    应急管理部  ：危险化学品安全生产、园区安全整治\n    市场监管总局  ：反垄断（规避价格垄断）、质量与标准\n\n  关键政策法规：  \n  《\"十四五\"原材料工业发展规划》《新材料产业发展指南》：新材料是战略性新兴产业政策重点\n  能耗双控与能耗强度约束：倒逼高耗能大宗品产能出清与技术改造\n  危化品安全整治与化工园区认定：入园入园门槛提高，不合规产能退出\n  碳达峰与碳市场扩围：化工行业碳核算、碳交易逐步覆盖，绿色低碳材料受益\n\n  准入条件提示：   化工项目需产业政策符合性审查+环评/安评/能评审批；危化品生产需安全生产许可证；新材料纳入目录的领域可获专项资金与税收优惠支持。\n\n  📎 参考出处：\n    工信部《\"十四五\"原材料工业发展规划》\n    生态环境部、应急管理部相关政策文件\n\n   8. 行业风险\n\n    周期波动风险：   大宗化工品价格随供需周期大幅波动，产能过剩阶段全行业亏损（历史上多轮\"扩产→过剩→亏损→出清\"循环）。\n    产能过剩风险：   前期资本开支集中投放，部分子行业（如部分锂电材料环节、传统大宗品）供给过剩持续压制价格。\n    原料价格风险：   油价、煤炭、矿石价格大幅波动直接冲击成本端与利润（原料依赖进口的环节受汇率与地缘影响）。\n    技术迭代风险：   新材料技术路线快速演进（如正极材料三元 vs 铁锂、钙钛矿对传统材料替代），押错路线资产贬值。\n    贸易与地缘风险：   出口摩擦、欧美限制措施影响海外收入；关键原料进口依赖（高纯度石英、部分特种气体）受制于人。\n    安全环保风险：   安全事故或环保处罚可能导致"])</script><script>self.__next_f.push([1,"16:T2886,"])</script><script>self.__next_f.push([1,"农业与食品 Agriculture \u0026 Food 从田间到餐桌：种业、种植、养殖、加工与流通组成的第一产业基本盘 农业 食品 种业 粮食 养殖 农产品加工 智慧农业 中粮集团 牧原股份 隆平高科 中粮集团 隆平高科 牧原股份 温氏股份 海大集团 金龙鱼 北大荒 新希望 \n   1. 行业一句话定义\n\n农业与食品行业是  覆盖\"从田间到餐桌\"全链条的产业：上游种业与投入品（种子、化肥、农药、饲料），中游种植/养殖生产，下游农产品加工、食品制造与流通零售  。它是最古老的行业，也是被数字技术、生物技术重新定义的行业——中国用它养活了全球约 18% 的人口，2026 年粮食产量目标稳定在 1.4 万亿斤左右，是第一产业基本盘。\n\n规模有多大？按农业农村部《中国农业展望报告（2026—2035）》，2026 年粮食产量预计达 7.16 亿吨、油料 4204 万吨；农作物自主选育品种面积占比已超 95%，种质资源保存总量居世界第一。  这是一个\"产量稳、利润薄、政策强、升级慢\"的行业  ：一端是关乎国家安全的粮食安全底线，一端是品牌化、预制菜、智慧农业带来的新增长曲线。\n\n  📎 参考出处：\n    中共中央、国务院《关于锚定农业农村现代化 扎实推进乡村全面振兴的意见》（2026 年中央一号文件，gov.cn）\n    农业农村部市场预警专家委员会《中国农业展望报告（2026—2035）》（2026 04 发布）\n    中国农业农村信息网《一季度农业农村经济保持良好发展势头》（2026 04）\n\n   2. 钱从哪来\n\n农业与食品的\"钱\"来自四个层次，模式差异极大：\n\n    卖产品（种植/养殖主业）：   卖粮、卖猪、卖禽、卖水产，收入 = 产量 × 价格。价格由市场供需和政策收储共同决定，  \"猪周期\"  是养殖业最典型的利润波动源——猪价从十几元到二十几元/公斤的涨跌，直接决定养殖企业是暴利还是巨亏。\n    卖投入品和服务（种业、饲料、农化、农机）：   种子按粒/袋卖、饲料按吨卖，赚的是技术溢价和规模成本差。种业是其中壁垒最高的一环：一粒好种子可以带来 10% 以上的单产提升，直接决定粮食产量。\n    加工增值（食品制造与深加工）：   把原粮、原肉变成品牌食品（食用油、肉制品、乳品、预制菜），赚\"品牌+渠道\"的钱，毛利显著高于初级农产品。这是农业\"由卖原料到卖产品\"的关键跃迁。\n    政策补贴与金融服务：   种粮补贴、农机购置补贴、高标准农田建设投入、农业保险与政策性收储，是保障\"种粮有人干\"的托底；近年来普惠金融向农村下沉，供应链金融（针对农户和合作社）也成为重要资金来源。\n\n一句话总结：  \"越靠近田间的环节越薄利、越看周期；越靠近消费者的环节越有品牌溢价；种业和科技服务是附加值最高的'卖水人'。\"  \n\n  📎 参考出处：\n    农业农村部《中国农业展望报告（2026—2035）》价格与贸易展望\n    中央一号文件关于粮食安全、种业振兴、高标准农田的部署\n    生猪产业大数据平台与上市猪企公告（猪周期描述）\n\n   3. 产业链上下游\n\n以\"投入品—生产—加工—流通\"为主线：\n\n  ① 上游（投入品与要素）：  \n  种业：杂交水稻/玉米/小麦种子研发（隆平高科、先正达中国、登海种业）、生物育种（基因编辑、转基因）\n  农资：化肥（氮磷钾、复合肥）、农药、饲料（海大、新希望、通威）\n  农机与农服：无人农机、植保无人机（关联低空经济）、农业大数据平台（关联数据中心与算力）\n\n  ② 中游（生产环节）：  \n  种植业：粮食（水稻、小麦、玉米）、油料、经济作物（蔬菜、水果、茶叶）\n  养殖业：生猪（牧原、温氏、新希望）、家禽、奶牛（伊利奶源基地）、水产（海大）\n  主要模式：规模化自养（牧原\"自繁自养\"）、\"公司+农户\"（温氏）、合作社+基地\n\n  ③ 下游（加工与流通）：  \n  粮食与油脂加工（中粮、金龙鱼）\n  肉制品与乳制品（双汇、伊利、蒙牛）\n  食品制造与预制菜（安井食品、味知香）\n  流通渠道：农批市场、商超、生鲜电商/社区团购、餐饮供应链（关联物流快递、快消与新消费）\n\n   mermaid\nflowchart LR\n  A[上游:种子·化肥·饲料·农机]     B[生产:种植·养殖]\n  B     C[加工:食品制造·深加工]\n  C     D[流通:商超·电商·餐饮]\n  D     E[消费者]\n  A     F[农服:植保·数字农业]\n  F     B\n   \n\n  📎 参考出处：\n    各细分领域代表企业取自上市公司年报/公开资料（隆平高科、牧原股份、海大集团等）\n    产业链结构参考中国农业大学/国家农业信息化工程技术研究中心公开资料\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  中粮集团   粮油食品央企龙头，覆盖粮油贸易、加工、品牌食品   央企托底粮食安全的\"主力军\"，全产业链布局  \n  隆平高科   杂交水稻种业龙头   种业振兴行动核心受益标的，海外市场拓展  \n  牧原股份   生猪养殖智能化龙头   全自养模式 + 智能化养猪，成本控制行业标杆  \n  温氏股份   \"公司+农户\"模式代表   轻资产扩张样本，猪鸡双主业平滑周期  \n  海大集团   饲料与养殖服务龙头   水产饲料全球领先，向养殖服务延伸  \n  金龙鱼   粮油加工龙头   品牌粮油市占率领先，厨房食品全品类  \n  北大荒   国有粮田经营主体   黑土地规模化种粮，\"中国大粮仓\"的代表  \n  新希望   饲料+生猪+食品多元布局   农牧巨头转型样本，供应链能力突出  \n\n  📎 参考出处：\n    各公司官网/年报公开资料（隆平高科、牧原股份、海大集团等公告）\n    种业振兴行动相关部委政策文件\n\n   5. 当前行业格局\n\n  规模（2026 年，官方口径）：  \n  2026 年中央一号文件：锚定农业农村现代化，粮食产量目标稳定在 1.4 万亿斤左右，深入实施新一轮千亿斤粮食产能提升行动，严守 18 亿亩耕地红线\n  《中国农业展望报告（2026—2035）》：2026 年粮食产量预计 7.16 亿吨（+0.2%）、单产预计提高至 400 千克/亩，油料 4204 万吨（+2.6%）；大豆食用消费、奶类消费均增\n  种业：农作物自主选育品种面积占比超 95%，种质资源保存总量世界第一；智慧农业市场规模 2026 年预计突破 1000 亿元级\n\n  集中度与竞争态势：  \n    种业：加速整合。   国家推进种业振兴行动，头部企业（隆平高科、先正达中国）靠品种+专利构筑壁垒，小企业靠同质化品种竞争\n    生猪养殖：规模化加速。   牧原、温氏、新希望等头部猪企出栏占比持续提升，散户加速退出；行业整体仍处\"产能去化—价格筑底\"周期\n    食品加工：寡头与长尾并存。   粮油、乳制品头部集中（金龙鱼、伊利、蒙牛），预制菜、休闲食品赛道分散、新品牌层出不穷（关联快消与新消费）\n    流通端：生鲜电商与预制菜重塑供应链。   社区团购、即时零售、餐饮连锁化推动 B 端食材供应链标准化\n\n一句话格局：  \"上游种业拼技术、中游养殖拼成本与周期、下游食品拼品牌与渠道、全链拼数字化。\"  \n\n  📎 参考出处：\n    2026 年中央一号文件（中国政府网）\n    农业农村部《中国农业展望报告（2026—2035）》\n    上市猪企月度销售公告与行业产能数据\n\n   6. 行业壁垒\n\n    生物与技术壁垒（最硬）：   种子品种审定周期长（数年）、生物育种牌照稀缺；育种是典型的\"十年磨一剑\"，先发者靠品种权与专利持续吃技术溢价。\n    资金与规模壁垒：   高标准农田改造、现代化猪场动辄数亿投入；养殖业重资产、回收期长，规模不经济的小散主体加速出清。\n    土地与资源壁垒：   耕地红线（18 亿亩）、养殖用地审批、水域滩涂养殖权等，构成天然的产能天花板；拿地/拿指标能力是扩张前提。\n    渠道与品牌壁垒：   食品端渠道费用高企，商超进场、电商流量、餐饮渠道进入都有门槛；品牌食品的信任积累需要长期投入，新品牌\"起盘快、守住难\"。\n    政策合规壁垒：   环保达标（养殖粪污处理）、食品安全标准（农残、兽残限量）、转基因/生物育种安全评价，违规即被一票否决。\n\n  📎 参考出处：\n    《种子法》及品种审定、生物育种安全评价相关规定\n    农业农村部高标准农田建设与耕地保护政策\n    《食品安全法》及农产品质量安全相关监管要求\n\n   7. 核心监管机制\n\n  归口部门：  \n    农业农村部  ：种植业与养殖业生产管理、种业、耕地与高标准农田、农产品质量安全\n    国家发展改革委  ：粮食价格政策、政策性收储、农业生产力布局\n    市场监管总局  ：食品安全监管、食品生产许可（SC）、广告与价格合规\n    海关总署  ：农产品进出口检验检疫、配额管理\n\n  关键政策与红线（近两年主线）：  \n    耕地保护红线  ：18 亿亩耕地红线 + 粮食安全党政同责，是农业政策的第一约束\n    种业振兴行动  ：深入实施，加快选育推广高产优质品种，培育农业领域科技领军企业\n    新一轮千亿斤粮食产能提升行动  ：统筹良田、良种、良机、良法协同增效\n    食品安全监管升级  ：农兽药残留限量标准趋严、食安追溯体系推广，\"四个最严\"持续执行\n    农业保险与补贴  ：三大主粮完全成本保险和种植收入保险扩面，政策性收储稳价格\n\n  准入条件提示：   种子生产经营需许可证；食品生产需 SC 许可；转基因研发需安全评价与品种审定双审批；养殖场需环评与防疫条件审核。\n\n  📎 参考出处：\n    中共中央、国务院 2026 年中央一号文件\n    《种子法》、《食品安全"])</script><script>self.__next_f.push([1,"17:T2746,"])</script><script>self.__next_f.push([1,"品牌广告与营销 Advertising \u0026 Marketing 把品牌装进用户脑子里：创意、媒介与流量的生意 广告 营销 品牌 效果广告 信息流 电梯媒体 媒介代理 分众传媒 蓝色光标 巨量引擎 字节跳动（巨量引擎） 阿里巴巴（阿里妈妈） 腾讯广告 分众传媒 蓝色光标 WPP / 阳狮 / 宏盟 省广集团 新潮传媒 \n   1. 行业一句话定义\n\n品牌广告与营销行业是  帮企业把产品变成品牌、把品牌变成销量的一整套专业服务：从市场洞察、创意内容、媒介投放，到效果评估与用户运营  。通俗说，它回答三个问题：跟谁说（人群）、说什么（创意）、在哪说（媒介）——以及说了之后卖了多少（效果）。\n\n规模有多大？市场监管总局《中国广告业发展指数报告（2026）》显示，2025 年中国广告业务收入  首次突破 2 万亿元，达 20502.1 亿元，同比增长 32.6%  ，五年实现翻番，市场规模稳居全球第二、亚太第一。  这是一个\"人人都是广告的观众、广告主预算决定天\"的行业  ：一端连着消费、汽车、电商、医药等几乎所有行业，一端被互联网平台与 AI 技术深刻重塑——增长引擎已经从\"人口红利\"切换为\"技术与创意双轮驱动\"。\n\n  📎 参考出处：\n    市场监管总局、中国经济信息社《中国广告业发展指数报告（2026）》（2026 06 23 发布）\n    市场监管总局广告监管司：《2025 年中国广告业务收入首次突破两万亿元》\n\n   2. 钱从哪来\n\n广告业的\"钱\"由广告主的投放预算构成，按链路分工分四层：\n\n    品牌广告预算（建认知）：   广告主为\"让更多人记住品牌\"付费——电视/电梯/户外大屏、开屏广告、赞助植入。按展示计费（CPM），短期不直接看成交，烧的是\"心智份额\"。消费、汽车、医药保健是传统大户。\n    效果广告预算（看转化）：   广告主为\"可量化的结果\"付费——点击（CPC）、下载、留资、下单（CPA）。按结果计费，花一元钱要看一元钱回报（ROI），是电商、游戏、本地生活等行业的主力投放。\n    媒介佣金与服务费（平台和代理赚的钱）：   互联网平台（巨量引擎、阿里妈妈、腾讯广告）通过广告系统赚取流量变现；广告代理公司（4A、本土代理）按媒介投放额抽成或按项目收服务费。\n    营销服务与数据生意（增值层）：   市场调研、品牌咨询、公关、达人种草、直播代运营、营销 SAAS——按项目/订阅收费，是广告业\"卖服务\"的部分，毛利高于纯媒介代理。\n\n一句话总结：  \"平台赚流量的钱，代理赚服务的钱，创意公司赚脑子的钱；钱多钱少，全看广告主对下一年生意的信心。\"   2025 年广告业务收入大增 32.6%，既有 AI 带动数字广告提效，也与\"国补\"等促消费政策直接拉动广告主投放有关。\n\n  📎 参考出处：\n    市场监管总局《中国广告业发展指数报告（2026）》：2025 年行业收入 20502.1 亿元、同比 +32.6%\n    QuestMobile《2025 年互联网广告市场半年报告》：广告主预算偏保守、向头部平台集中\n\n   3. 产业链上下游\n\n以\"广告主—媒介—用户\"为主线：\n\n  ① 上游（钱与决策方 = 广告主）：  \n  消费品与零售（快消、美妆、食品饮料——2025 上半年美妆护理投放超 720 亿元，居各行业之首）\n  平台经济（电商、网服、本地生活）、交通出行、医药保健、金融、教育、游戏\n  广告主自建营销中台（CMO/市场部），决定预算投向\"品牌\"还是\"效果\"\n\n  ② 中游（服务与媒介执行）：  \n  代理与创意公司：国际 4A（WPP、阳狮、宏盟）、本土全案（蓝色光标、省广集团）、创意热店、公关公司\n  媒介平台：互联网广告平台（字节巨量引擎、阿里妈妈、腾讯广告、拼多多、快手、B站等）、传统媒体（电视、报纸）、户外/电梯（分众、新潮）\n  数据与工具：程序化广告平台（DSP/ADX）、营销云、达人营销 MCN、直播代运营\n\n  ③ 下游（被触达的用户）：  \n  用户注意力被不同屏幕切碎：短视频、电商站内、社交信息流、电梯、线下\n  用户的购买行为（种草—搜索—下单—复购）反向决定广告投放的归因与优化\n\n   mermaid\nflowchart LR\n  A[广告主:消费·电商·汽车·医药]     B[品牌预算/效果预算]\n  B     C[代理与创意:4A·本土·MCN]\n  C     D[媒介:互联网平台·电梯·户外]\n  D     E[用户注意力]\n  E     F[转化:点击·下单·复购]\n  F     A\n  G[AI与数据技术]  .赋能.   C\n  G  .赋能.   D\n   \n\n  📎 参考出处：\n    QuestMobile《2025 年互联网广告市场半年报告》各行业投放规模\n    上市公司财报/公开资料（分众传媒、蓝色光标年报）\n\n   4. 代表机构/公司\n\n  公司   一句话角色   看点  \n             \n  字节跳动（巨量引擎）   国内数字广告最大平台   短视频+信息流+电商闭环，广告收入规模全球前列  \n  阿里巴巴（阿里妈妈）   电商广告龙头   站内搜索+推荐流广告，直接挂钩商家 GMV  \n  腾讯广告   社交+内容流量平台   视频号、小程序广告快速增量，微信生态营销中枢  \n  分众传媒   电梯媒体龙头   2026 10 市场监管总局附条件批准其收购新潮传媒，梯媒整合标志性事件  \n  蓝色光标   营销服务龙头   率先把 AI 引入内容生产与投放，向\"AI First\"转型  \n  WPP / 阳狮 / 宏盟   国际 4A 集团   服务全球大客户，创意与媒介代理的行业标杆  \n  省广集团   本土老牌代理   国企背景全案服务商，快消、汽车等行业客户基础厚  \n  新潮传媒   电梯媒体第二梯队   被分众收购后，梯媒从\"双雄对抗\"走向\"龙头整合\"  \n\n  📎 参考出处：\n    市场监管总局 2026 10 10 关于分众传媒收购新潮传媒股权案审查公告\n    各公司年报/官网公开资料\n\n   5. 当前行业格局\n\n  规模（2025 年，市场监管总局口径）：  \n  广告业务收入   20502.1 亿元  （+32.6%），首次突破 2 万亿元，五年翻番；市场规模全球第二\n    互联网广告  业务收入 13574.3 亿元，占总收入   66.2%  ；若看\"发布环节\"，互联网发布收入占比已超 85%（2025 年数据）\n  2026 年一季度头部企事业单位广告业务收入同比   +17.1%  ，行业延续稳健增长\n\n  集中度与竞争态势：  \n    互联网平台强者恒强，集中度极高。   2025 年 19 家头部互联网公司中，阿里、拼多多、腾讯三家广告收入合计占六成以上；字节居首但未完整披露广告口径。京东营销收入 1071 亿元、快手线上营销 815 亿元，构成第二梯队；百度搜索广告同比下滑约 18%、B站广告首破百亿——  预算在向\"有 AI 落地能力与站内转化闭环\"的平台集中  。\n    梯媒进入\"整合时代\"。   分众收购新潮获附条件批准（2026 10 10），电梯媒体从双雄竞争转向一家独大格局；市场监管总局同时指出交通出行、户外大屏对电梯媒体构成竞争约束。\n    AI 营销成为分水岭。   AIGC 把创意素材生产成本打到接近零边际，程序化投放智能化，\"技术+创意\"双轮驱动取代传统\"人海创意\"；2025 年互联网广告市场增速约 11.5%，增长已从流量扩张切换为价值深耕。\n    品牌与效果从\"对立\"走向\"合一\"。   广告主既要声量又要销量，品效合一、全域营销成为预算分配的主流逻辑。\n\n一句话格局：  \"平台端看 AI 与闭环，媒体端看场景垄断，服务端看谁能用 AI 把成本打下来；广告主预算向效率最高的链路集中。\"  \n\n  📎 参考出处：\n    市场监管总局《中国广告业发展指数报告（2026）》\n    36氪/Morketing《19 家互联网公司 2025 年广告营收盘点》\n    中关村互动营销实验室《2025 年中国互联网广告营销趋势报告》\n\n   6. 行业壁垒\n\n    媒介资源壁垒（最硬）：   电梯、户外大屏、开屏点位是\"稀缺空间\"，点位扩张需要长期资本与物业关系积累；互联网平台则靠流量入口与数据闭环形成护城河（抖音、微信、淘宝的站内广告天然闭环）。这是分众收购新潮后\"1+1 2\"的根源。\n    技术与数据壁垒（最活）：   精准投放依赖用户数据、标签与归因模型；AI 能力决定素材生产速度和投放优化效率。没有数据与算法能力的公司，在品效合一时代表现乏力。\n    创意与人才壁垒（最软）：   好创意仍是稀缺品，顶级创意人才与 AIGC 工具的组合是差异化来源；国际 4A 靠方法论与人才体系构筑服务壁垒。\n    客户关系与信任壁垒（最隐性）：   广告主更换代理有切换成本，大客户的年度框架合同、长期服务关系一旦建立就相对稳定；代理公司靠\"效果可证明、账期可承受\"维系客户。\n    合规壁垒：   广告内容要过《广告法》审查，医疗、金融、教育培训等特殊行业投放需资质核验；虚假违法广告面临罚款甚至停投处罚。\n\n  📎 参考出处：\n    市场监管总局分众 新潮经营者集中审查公告（附条件批准理由）\n    《广告法》及《互联网广告管理办法》监管要求\n\n   7. 核心监管机制\n\n  归口部门：  \n    市场监管总局  ：广告监管牵头部门——广告内容审查、违法广告执法、《广告法》执行\n    国家网信办  ：互联网信息内容监管、算法推荐与大数据\"杀熟\"治理\n    工信部  ：互联网平台技术治理、个人信息保护（配合网信办）\n    国家广电总局  ：广播电视与网络视听广告规范\n\n  关键政策与红线（近两年主线）：  \n    《广告法》（2021 修正）  ：广告"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"DI4rc3DVBSjUvPC6q9LFL\",\"p\":\"/industry-insight\",\"c\":[\"\",\"search\",\"\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"search\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/industry-insight/_next/static/css/6c313e96cbcf89bb.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefine
